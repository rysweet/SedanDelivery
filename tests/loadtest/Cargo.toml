[package]
name = "loadtest"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Load testing tool for SedanDelivery Bolt endpoint"
publish = false

[[bin]]
name = "loadtest"
path = "src/main.rs"

[dependencies]
neo4rs = "0.8"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
