scenario:
  name: "Export and Import — JSON Format Round-Trip"
  description: "Verifies export dialog produces JSON, and import dialog accepts it to recreate the graph"
  type: web
  tags: [e2e, export, import]
  timeout: 90s

  variables:
    graph_name: "e2e-export"
    api_base: "http://localhost:5000/api"

  steps:
    - action: api_call
      method: POST
      url: "${api_base}/graphs"
      body: '{"name": "${graph_name}"}'

    - action: api_call
      method: POST
      url: "${api_base}/graphs/${graph_name}/mutate"
      body: '{"cypher": "CREATE (a:Person {name: \"Alice\"})-[:KNOWS]->(b:Person {name: \"Bob\"})"}'

    - action: navigate
      url: "http://localhost:5173"

    - action: wait_for_element
      selector: "[aria-label='Select graph']"
      timeout: 10s

    - action: click
      selector: "[aria-label='Select graph']"

    - action: click
      text: "${graph_name}"

    - action: wait_for_element
      selector: ":has-text('2 nodes')"
      timeout: 8s

    # Phase 1: Open export dialog
    - action: click
      selector: "[aria-label='Export']"
      description: "Open export dialog"

    - action: wait_for_element
      selector: ":has-text('Export Graph')"
      timeout: 5s
      description: "Export dialog should open"

    - action: verify_element
      selector: ":has-text('JSON')"
      exists: true
      description: "JSON format option should be available"

    - action: click
      text: "JSON"
      description: "Select JSON format"

    - action: screenshot
      save_as: "07-export-dialog.png"

    - action: click
      text: "Export"
      description: "Initiate download"

    # Note: actual file download verification depends on browser automation capabilities

    - action: screenshot
      save_as: "07-export-complete.png"

    # Phase 2: Open import dialog
    - action: click
      selector: "[aria-label='Import']"
      description: "Open import dialog"

    - action: wait_for_element
      selector: ":has-text('Import Graph')"
      timeout: 5s
      description: "Import dialog should open"

    - action: screenshot
      save_as: "07-import-dialog.png"

    # Close the dialog (actual file import tested via API)
    - action: send_keypress
      value: "escape"

  cleanup:
    - action: api_call
      method: DELETE
      url: "${api_base}/graphs/${graph_name}"
      continue_on_failure: true
