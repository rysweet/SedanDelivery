scenario:
  name: "Deploy Secrets Provisioning Contract"
  description: >
    Validates that deploy.yml provisions BOLT_PASSWORD as a Container Apps
    secret and conditionally configures in-process TLS only when
    DEPLOY_BOLT_TLS_CERT_PEM / DEPLOY_BOLT_TLS_KEY_PEM are set.
  type: cli
  tags: [e2e, deploy, secrets, bolt]
  timeout: 30s

  # This scenario validates the deploy.yml contract by inspecting the workflow
  # YAML structure — it does NOT run the actual Azure deploy.

  variables:
    deploy_yml: ".github/workflows/deploy.yml"

  steps:
    # ── BOLT_PASSWORD secret generation ──────────────────────────────────
    - action: shell
      command: "grep -c 'openssl rand -base64 32' ${deploy_yml}"
      expected_exit_code: 0
      verify_output_contains: ["2"]
      description: "BOLT_PASSWORD is generated via openssl rand (new deploy + migration)"

    - action: shell
      command: "grep -c 'bolt-password' ${deploy_yml}"
      expected_exit_code: 0
      verify_output_matches: "^[1-9][0-9]*$"
      description: "bolt-password secret is referenced in deploy.yml"

    - action: shell
      command: "grep 'BOLT_PASSWORD=secretref:bolt-password' ${deploy_yml}"
      expected_exit_code: 0
      description: "BOLT_PASSWORD env var uses secretref to bolt-password"

    # ── TLS is conditional, not mandatory ────────────────────────────────
    - action: shell
      command: "grep 'BOLT_TLS_ENABLED=false' ${deploy_yml}"
      expected_exit_code: 0
      description: "TLS defaults to disabled (BOLT_TLS_ENABLED=false)"

    - action: shell
      command: "grep 'BOLT_TLS_ENABLED=true' ${deploy_yml}"
      expected_exit_code: 0
      description: "TLS is enabled when cert/key secrets are present"

    - action: shell
      command: "grep -E 'BOLT_REQUIRE_TLS=1' ${deploy_yml} | grep -v '#'"
      expected_exit_code: 0
      description: "BOLT_REQUIRE_TLS=1 is set (only inside TLS-enabled block)"

    # ── No hard failure when TLS secrets are absent ──────────────────────
    - action: shell
      command: >
        grep -c '::error::DEPLOY_BOLT_TLS_CERT_PEM and DEPLOY_BOLT_TLS_KEY_PEM' ${deploy_yml}
      expected_exit_code: 1
      description: "No hard error when TLS secrets are missing (warning only)"

    - action: shell
      command: "grep '::warning::DEPLOY_BOLT_TLS_CERT_PEM' ${deploy_yml}"
      expected_exit_code: 0
      description: "Emits a warning (not error) when TLS secrets are absent"

    # ── Rust startup won't panic without TLS in production ───────────────
    - action: shell
      command: "grep 'check_bolt_tls_env(false)' sedandelivery-bolt/src/main.rs"
      expected_exit_code: 0
      description: "TLS env check does NOT hard-require TLS based on ENVIRONMENT"

    - action: shell
      command: "grep 'check_bolt_password_env(production_mode)' sedandelivery-bolt/src/main.rs"
      expected_exit_code: 0
      description: "Password is still required in production mode"

    # ── Secret volume mount is conditional on TLS ────────────────────────
    - action: shell
      command: "grep 'VOLUME_MOUNT_ARGS' ${deploy_yml}"
      expected_exit_code: 0
      description: "Secret volume mount is conditionally applied via VOLUME_MOUNT_ARGS"
