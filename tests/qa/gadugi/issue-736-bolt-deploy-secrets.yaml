# Canonical gadugi scenario for Issue #736.

scenario:
  name: "Issue #736 - Bolt deploy secret provisioning and TLS-enforced production startup"
  description: >
    Verify from an operator perspective that the checked-in deploy workflow
    contract includes `bolt-password` reuse/migration and operator-managed Bolt
    TLS wiring for external TCP ingress, and that a local production Bolt
    instance starts only with password auth plus in-process TLS.
  metadata:
    tags: [cli, deployment, bolt, authentication, tls, regression, issue-736]
    priority: high
    linked_docs:
      - docs/DEPLOY.md
      - docs/index.md
      - docs/secrets.md
  agents:
    - name: cli-agent
      type: cli
      config: {}
  steps:
    - name: "Run the Bolt deploy secret validator"
      agent: cli-agent
      action: execute
      params:
        command: bash
        args:
          - ./scripts/test-bolt-deploy-secrets.sh
      timeout: 300000
    - name: "Confirm static deploy workflow contract reuses or generates bolt-password"
      agent: cli-agent
      action: wait_for_output
      params:
        pattern: "\\[PASS\\]\\s+Static deploy workflow contract reuses or generates bolt-password secret"
      timeout: 5000
    - name: "Confirm static deploy workflow contract requires operator-managed TLS secrets"
      agent: cli-agent
      action: wait_for_output
      params:
        pattern: "\\[PASS\\]\\s+Static deploy workflow contract requires operator-managed Bolt TLS secrets for external TCP"
      timeout: 5000
    - name: "Confirm static deploy workflow contract mounts TLS secrets"
      agent: cli-agent
      action: wait_for_output
      params:
        pattern: "\\[PASS\\]\\s+Static deploy workflow contract mounts TLS secrets and enables in-process Bolt TLS"
      timeout: 5000
    - name: "Confirm production Bolt starts with in-process TLS"
      agent: cli-agent
      action: wait_for_output
      params:
        pattern: "\\[PASS\\]\\s+Production Bolt starts with in-process TLS and password auth"
      timeout: 5000
    - name: "Confirm TLS handshake succeeds"
      agent: cli-agent
      action: wait_for_output
      params:
        pattern: "\\[PASS\\]\\s+TLS handshake succeeds with configured certificate"
      timeout: 5000
    - name: "Confirm correct password authenticates over TLS"
      agent: cli-agent
      action: wait_for_output
      params:
        pattern: "\\[PASS\\]\\s+Correct BOLT_PASSWORD authenticates successfully over TLS"
      timeout: 5000
    - name: "Confirm wrong password is rejected"
      agent: cli-agent
      action: wait_for_output
      params:
        pattern: "\\[PASS\\]\\s+Incorrect BOLT_PASSWORD is rejected while valid credentials still work"
      timeout: 5000
    - name: "Confirm production rejects missing TLS"
      agent: cli-agent
      action: wait_for_output
      params:
        pattern: "\\[PASS\\]\\s+Production Bolt refuses startup without TLS configuration"
      timeout: 5000
    - name: "Confirm validator finished successfully"
      agent: cli-agent
      action: wait_for_output
      params:
        pattern: "\\[PASS\\]\\s+Bolt deploy secret validator passed"
      timeout: 5000
    - name: "Confirm validator exited with code 0"
      agent: cli-agent
      action: validate_exit_code
      params:
        text: "0"
