# Canonical gadugi scenario for Issue #736 — Bolt deploy TLS secret contract.
#
# This scenario validates the operator-facing deployment invariant documented in
# docs/DEPLOY.md as AC-09 dual enforcement:
#   - pre-deploy guard: PEM content must not be injected via env vars
#   - post-deploy smoke: Bolt ACA must be provisioned, externally reachable over
#     TCP, and configured to load TLS material from mounted secret files while
#     enforcing BOLT_REQUIRE_TLS=1
#
# Callers must explicitly provide ISSUE_736_DEPLOY_RG / ISSUE_736_BOLT_CA_NAME;
# optional overrides exist for ISSUE_736_BOLT_HOST and the expected mounted-path
# values when validating nonstandard environments.

scenario:
  name: "Issue #736 - Bolt deploy TLS secret contract"
  description: >
    Verifies from an operator perspective that a deployed Bolt Container App is
    provisioned successfully, exposes external TCP ingress on port 7687, mounts
    TLS certificate/key secrets as files (rather than leaking PEM into env
    vars), enforces BOLT_REQUIRE_TLS=1, and presents a certificate on the live
    Bolt endpoint.
  environment:
    ISSUE_736_EXPECT_EXTERNAL: "true"
    ISSUE_736_EXPECT_TRANSPORT: "tcp"
    ISSUE_736_EXPECT_CERT_PATH: "/mnt/secrets/bolt-tls-cert"
    ISSUE_736_EXPECT_KEY_PATH: "/mnt/secrets/bolt-tls-key"
    ISSUE_736_BOLT_PORT: "7687"
  metadata:
    tags: [cli, deploy, security, bolt, tls, secrets, regression, issue-736]
    priority: high
    linked_docs:
      - docs/DEPLOY.md
      - docs/secrets.md
  agents:
    - name: cli-agent
      type: cli
      config: {}

  steps:
    - name: "A1 — Run the issue-736 deploy-secret validator"
      agent: cli-agent
      action: execute
      params:
        command: bash
        args:
          - -lc
          - >
            set -euo pipefail;
            RG="${ISSUE_736_DEPLOY_RG:-}";
            CA_NAME="${ISSUE_736_BOLT_CA_NAME:-}";
            EXPECTED_EXTERNAL="${ISSUE_736_EXPECT_EXTERNAL:-true}";
            EXPECTED_TRANSPORT="${ISSUE_736_EXPECT_TRANSPORT:-tcp}";
            EXPECTED_CERT_PATH="${ISSUE_736_EXPECT_CERT_PATH:-/mnt/secrets/bolt-tls-cert}";
            EXPECTED_KEY_PATH="${ISSUE_736_EXPECT_KEY_PATH:-/mnt/secrets/bolt-tls-key}";
            BOLT_PORT="${ISSUE_736_BOLT_PORT:-7687}";
            [[ -n "${RG}" ]] || { echo "[FAIL] ISSUE_736_DEPLOY_RG must be set" >&2; exit 1; };
            [[ -n "${CA_NAME}" ]] || { echo "[FAIL] ISSUE_736_BOLT_CA_NAME must be set" >&2; exit 1; };
            APP_JSON="$(az containerapp show --name "${CA_NAME}" --resource-group "${RG}" --output json)";
            PROVISIONING_STATE="$(jq -r '.properties.provisioningState // empty' <<<"${APP_JSON}")";
            [[ "${PROVISIONING_STATE}" == "Succeeded" ]] || { echo "[FAIL] provisioning state ${PROVISIONING_STATE}" >&2; exit 1; };
            echo "[PASS] provisioning succeeded";
            EXTERNAL="$(jq -r '(.properties.configuration.ingress.external // false) | tostring' <<<"${APP_JSON}")";
            [[ "${EXTERNAL}" == "${EXPECTED_EXTERNAL}" ]] || { echo "[FAIL] ingress external ${EXTERNAL}" >&2; exit 1; };
            echo "[PASS] ingress external matches expected";
            TRANSPORT="$(jq -r '.properties.configuration.ingress.transport // empty' <<<"${APP_JSON}")";
            [[ "${TRANSPORT,,}" == "${EXPECTED_TRANSPORT,,}" ]] || { echo "[FAIL] ingress transport ${TRANSPORT}" >&2; exit 1; };
            echo "[PASS] ingress transport is tcp";
            TLS_REQUIRED="$(jq -r 'first(.properties.template.containers[]?.env[]? | select(.name=="BOLT_REQUIRE_TLS") | .value) // empty' <<<"${APP_JSON}")";
            [[ "${TLS_REQUIRED}" == "1" ]] || { echo "[FAIL] BOLT_REQUIRE_TLS=${TLS_REQUIRED}" >&2; exit 1; };
            echo "[PASS] bolt require tls enabled";
            TLS_CERT_PATH="$(jq -r 'first(.properties.template.containers[]?.env[]? | select(.name=="BOLT_TLS_CERT") | .value) // empty' <<<"${APP_JSON}")";
            TLS_KEY_PATH="$(jq -r 'first(.properties.template.containers[]?.env[]? | select(.name=="BOLT_TLS_KEY") | .value) // empty' <<<"${APP_JSON}")";
            [[ "${TLS_CERT_PATH}" == "${EXPECTED_CERT_PATH}" && "${TLS_KEY_PATH}" == "${EXPECTED_KEY_PATH}" ]] || { echo "[FAIL] tls paths cert=${TLS_CERT_PATH} key=${TLS_KEY_PATH}" >&2; exit 1; };
            echo "[PASS] tls env points at mounted secret files";
            if jq -e '.properties.template.containers[]?.env[]? | select((.value // "") | test("BEGIN CERTIFICATE|BEGIN (RSA )?PRIVATE KEY"))' <<<"${APP_JSON}" >/dev/null; then
              echo "[FAIL] PEM content leaked into container env vars" >&2; exit 1;
            fi;
            echo "[PASS] no pem content leaked into env";
            SECRET_NAMES="$(jq -r '.properties.configuration.secrets[]?.name // empty' <<<"${APP_JSON}")";
            grep -Fxq 'bolt-tls-cert' <<<"${SECRET_NAMES}" || { echo "[FAIL] missing bolt-tls-cert secret" >&2; exit 1; };
            grep -Fxq 'bolt-tls-key' <<<"${SECRET_NAMES}" || { echo "[FAIL] missing bolt-tls-key secret" >&2; exit 1; };
            echo "[PASS] tls secret names present";
            jq -e '[.properties.template.volumes[]? | select(.storageType=="Secret")] | length >= 1' <<<"${APP_JSON}" >/dev/null || { echo "[FAIL] no secret volume mounted" >&2; exit 1; };
            echo "[PASS] secret volume present";
            ALLOW_SELF_SIGNED="$(jq -r 'first(.properties.template.containers[]?.env[]? | select(.name=="BOLT_ALLOW_SELF_SIGNED") | .value) // empty' <<<"${APP_JSON}")";
            [[ -z "${ALLOW_SELF_SIGNED}" ]] || { echo "[FAIL] BOLT_ALLOW_SELF_SIGNED unexpectedly set to ${ALLOW_SELF_SIGNED}" >&2; exit 1; };
            echo "[PASS] self-signed override absent";
            BOLT_HOST="${ISSUE_736_BOLT_HOST:-$(jq -r '.properties.configuration.ingress.fqdn // empty' <<<"${APP_JSON}")}";
            [[ -n "${BOLT_HOST}" ]] || { echo "[FAIL] bolt fqdn missing" >&2; exit 1; };
            HANDSHAKE_LOG="$(mktemp)";
            EXPECTED_CERT_FILE="$(mktemp)";
            LIVE_CERT_FILE="$(mktemp)";
            trap 'rm -f "${HANDSHAKE_LOG}" "${EXPECTED_CERT_FILE}" "${LIVE_CERT_FILE}"' EXIT;
            HANDSHAKE_EXIT=0;
            timeout 15 openssl s_client -connect "${BOLT_HOST}:${BOLT_PORT}" -servername "${BOLT_HOST}" -showcerts </dev/null >"${HANDSHAKE_LOG}" 2>&1 || HANDSHAKE_EXIT=$?;
            if [[ "${HANDSHAKE_EXIT}" != "0" && "${HANDSHAKE_EXIT}" != "124" ]]; then
              echo "[FAIL] openssl s_client exited with status ${HANDSHAKE_EXIT}" >&2;
              cat "${HANDSHAKE_LOG}" >&2;
              exit 1;
            fi;
            EXPECTED_CERT_PEM="$(az containerapp secret show --name "${CA_NAME}" --resource-group "${RG}" --secret-name bolt-tls-cert --query value -o tsv 2>/dev/null || echo "")";
            [[ -n "${EXPECTED_CERT_PEM}" ]] || { echo "[FAIL] configured bolt-tls-cert secret could not be read" >&2; exit 1; };
            printf '%s\n' "${EXPECTED_CERT_PEM}" > "${EXPECTED_CERT_FILE}";
            awk '/BEGIN CERTIFICATE/{flag=1} flag{print} /END CERTIFICATE/{exit}' "${HANDSHAKE_LOG}" > "${LIVE_CERT_FILE}";
            grep -q 'BEGIN CERTIFICATE' "${LIVE_CERT_FILE}" || { echo "[FAIL] no certificate presented by bolt endpoint" >&2; cat "${HANDSHAKE_LOG}" >&2; exit 1; };
            EXPECTED_CERT_SHA256="$(openssl x509 -in "${EXPECTED_CERT_FILE}" -noout -fingerprint -sha256 2>/dev/null | cut -d= -f2 | tr -d ':')";
            LIVE_CERT_SHA256="$(openssl x509 -in "${LIVE_CERT_FILE}" -noout -fingerprint -sha256 2>/dev/null | cut -d= -f2 | tr -d ':')";
            [[ -n "${EXPECTED_CERT_SHA256}" && "${LIVE_CERT_SHA256}" == "${EXPECTED_CERT_SHA256}" ]] || { echo "[FAIL] live certificate does not match configured bolt-tls-cert" >&2; cat "${HANDSHAKE_LOG}" >&2; exit 1; };
            echo "[PASS] bolt endpoint presents configured tls certificate";
            openssl x509 -in "${LIVE_CERT_FILE}" -checkend 0 -noout >/dev/null 2>&1 || { echo "[FAIL] live tls certificate is expired" >&2; cat "${HANDSHAKE_LOG}" >&2; exit 1; };
            echo "[PASS] live tls certificate is within its validity window";
      timeout: 120000

    - name: "A2 — Confirm provisioning succeeded"
      agent: cli-agent
      action: wait_for_output
      params:
        pattern: "\\[PASS\\]\\s+provisioning succeeded"
      timeout: 5000

    - name: "A3 — Confirm ingress is external"
      agent: cli-agent
      action: wait_for_output
      params:
        pattern: "\\[PASS\\]\\s+ingress external matches expected"
      timeout: 5000

    - name: "A4 — Confirm ingress transport is TCP"
      agent: cli-agent
      action: wait_for_output
      params:
        pattern: "\\[PASS\\]\\s+ingress transport is tcp"
      timeout: 5000

    - name: "A5 — Confirm BOLT_REQUIRE_TLS=1"
      agent: cli-agent
      action: wait_for_output
      params:
        pattern: "\\[PASS\\]\\s+bolt require tls enabled"
      timeout: 5000

    - name: "A6 — Confirm TLS paths use mounted secret files"
      agent: cli-agent
      action: wait_for_output
      params:
        pattern: "\\[PASS\\]\\s+tls env points at mounted secret files"
      timeout: 5000

    - name: "A7 — Confirm PEM content is absent from env"
      agent: cli-agent
      action: wait_for_output
      params:
        pattern: "\\[PASS\\]\\s+no pem content leaked into env"
      timeout: 5000

    - name: "A8 — Confirm TLS secret names exist"
      agent: cli-agent
      action: wait_for_output
      params:
        pattern: "\\[PASS\\]\\s+tls secret names present"
      timeout: 5000

    - name: "A9 — Confirm secret volume exists"
      agent: cli-agent
      action: wait_for_output
      params:
        pattern: "\\[PASS\\]\\s+secret volume present"
      timeout: 5000

    - name: "A10 — Confirm self-signed override absent"
      agent: cli-agent
      action: wait_for_output
      params:
        pattern: "\\[PASS\\]\\s+self-signed override absent"
      timeout: 5000

    - name: "A11 — Confirm Bolt endpoint presents configured TLS certificate"
      agent: cli-agent
      action: wait_for_output
      params:
        pattern: "\\[PASS\\]\\s+bolt endpoint presents configured tls certificate"
      timeout: 5000

    - name: "A12 — Confirm live TLS certificate is within its validity window"
      agent: cli-agent
      action: wait_for_output
      params:
        pattern: "\\[PASS\\]\\s+live tls certificate is within its validity window"
      timeout: 5000

    - name: "A13 — Confirm validator exited cleanly"
      agent: cli-agent
      action: validate_exit_code
      params:
        text: "0"
