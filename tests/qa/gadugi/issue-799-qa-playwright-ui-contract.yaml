# Canonical gadugi scenario for PR #799 — qa-playwright UI contract repair.
#
# This scenario validates, from an external browser user's perspective, the
# behavior repaired by PR #799:
#   - Cypher CREATE mutations execute successfully through the SPA editor
#   - invalid Cypher returns the expected 400 error contract
#   - graph-specific query execution still works after switching graphs
#
# The scenario targets the same local harness used by the repaired
# qa-playwright workflow:
#   - gql-api on http://127.0.0.1:3001
#   - Vite SPA on http://127.0.0.1:5175 with VITE_E2E_TEST_AUTH=true

scenario:
  name: "PR #799 - qa-playwright UI contract repair"
  description: >
    Verifies the repaired Cypher editor contract through the live SPA by driving
    the browser against the local qa-playwright harness. Confirms successful
    CREATE mutation execution, invalid-Cypher 400 handling, and graph-specific
    query results after switching graphs.
  environment:
    ISSUE_799_APP_URL: "http://127.0.0.1:5175"
    ISSUE_799_API_BASE: "http://127.0.0.1:3001"
    ISSUE_799_GRAPH_NAME: "qa-issue-799"
    ISSUE_799_DETAIL_GRAPH_NAME: "qa-issue-799-detail"
  metadata:
    tags: [cli, web, regression, qa-playwright, cypher, issue-799]
    priority: high
    linked_docs:
      - .github/workflows/qa-playwright.yml
      - .github/workflows/README.md
  agents:
    - name: cli-agent
      type: cli
      config: {}

  steps:
    - name: "A1 — Drive the live SPA through the repaired Cypher flows"
      agent: cli-agent
      action: execute
      params:
        command: node
        args:
          - tests/qa/gadugi/issue-799-qa-playwright-ui-contract.cjs
      timeout: 180000

    - name: "A2 — Confirm gql-api local harness is reachable"
      agent: cli-agent
      action: wait_for_output
      params:
        pattern: "PASS: gql-api health check ok"
      timeout: 5000

    - name: "A3 — Confirm fixtures seeded"
      agent: cli-agent
      action: wait_for_output
      params:
        pattern: "PASS: local graph fixtures seeded"
      timeout: 5000

    - name: "A4 — Confirm CREATE mutation succeeds through UI"
      agent: cli-agent
      action: wait_for_output
      params:
        pattern: "PASS: cypher create mutation executed via UI"
      timeout: 5000

    - name: "A5 — Confirm invalid Cypher returns 400 through UI"
      agent: cli-agent
      action: wait_for_output
      params:
        pattern: "PASS: invalid cypher returns 400 via UI"
      timeout: 5000

    - name: "A6 — Confirm graph-specific query returns expected row"
      agent: cli-agent
      action: wait_for_output
      params:
        pattern: "PASS: graph-specific query returns expected row"
      timeout: 5000

    - name: "A7 — Confirm full issue-799 browser contract passes"
      agent: cli-agent
      action: wait_for_output
      params:
        pattern: "PASS: issue-799 qa-playwright UI contract verified"
      timeout: 5000

    - name: "A8 — Confirm browser contract script exited cleanly"
      agent: cli-agent
      action: validate_exit_code
      params:
        text: "0"
