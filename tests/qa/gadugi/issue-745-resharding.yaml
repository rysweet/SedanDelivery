# Canonical gadugi scenario for Issue #745 resharding validation.

scenario:
  name: "Issue #745 - Redis Cluster resharding resilience"
  description: >
    Verify from an operator perspective that live Bolt writes and label
    mutations continue to succeed while Redis Cluster slots are resharded, and
    that the final metrics report zero backend errors during the test window.
  environment:
    VALKEY_PASSWORD: "local-cluster-pass"
    BOLT_PASSWORD: "local-bolt-pass"
  metadata:
    tags: [cli, cluster, resilience, resharding, regression, issue-745]
    priority: critical
  agents:
    - name: cli-agent
      type: cli
      config: {}
  steps:
    - name: "Run the resharding resilience validator"
      agent: cli-agent
      action: execute
      params:
        command: bash
        args:
          - ./scripts/test-resharding-resilience.sh
      timeout: 420000
    - name: "Confirm live Bolt load completed with zero write errors"
      agent: cli-agent
      action: wait_for_output
      params:
        pattern: "\\[LOAD\\] Completed: [1-9]\\d+ writes, 0 errors over 60s"
      timeout: 5000
    - name: "Confirm read checks succeeded during slot movement"
      agent: cli-agent
      action: wait_for_output
      params:
        pattern: "\\[READ\\] Completed: [1-9]\\d* checks, 0 errors during load"
      timeout: 5000
    - name: "Confirm label mutation checks succeeded during slot movement"
      agent: cli-agent
      action: wait_for_output
      params:
        pattern: "\\[LABEL\\] Completed: [1-9]\\d* mutation cycles, 0 errors during load"
      timeout: 5000
    - name: "Confirm post-reshard read-back matched the loaded node count"
      agent: cli-agent
      action: wait_for_output
      params:
        pattern: "\\[PASS\\]\\s+Read-back after resharding matched load count \\([1-9]\\d+ nodes\\)"
      timeout: 5000
    - name: "Confirm backend error delta stayed at zero"
      agent: cli-agent
      action: wait_for_output
      params:
        pattern: "New errors during test:\\s+0"
      timeout: 5000
    - name: "Confirm operator summary reports success"
      agent: cli-agent
      action: wait_for_output
      params:
        pattern: "\\[PASS\\]\\s+No StorageError::Backend errors during resharding"
      timeout: 5000
    - name: "Confirm validator exited with code 0"
      agent: cli-agent
      action: validate_exit_code
      params:
        text: "0"
