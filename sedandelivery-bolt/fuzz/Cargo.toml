[package]
name = "sedandelivery-bolt-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
sedandelivery-bolt = { path = ".." }

# Prevent this crate from interfering with the workspace.
[workspace]

[[bin]]
name = "decode_random"
path = "fuzz_targets/decode_random.rs"
doc = false

[[bin]]
name = "encode_decode_roundtrip"
path = "fuzz_targets/encode_decode_roundtrip.rs"
doc = false

[[bin]]
name = "chunk_decode_random"
path = "fuzz_targets/chunk_decode_random.rs"
doc = false
