[package]
name    = "sedandelivery-bolt"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "sedandelivery-bolt"
path = "src/main.rs"

[dependencies]
cypher-core        = { path = "../cypher-core" }
sd2-redis-store = { path = "../sd2-redis-store" }
redis           = { version = "1.2.1", default-features = false, features = ["tokio-comp"] }
dashmap        = "6"
tokio         = { version = "1", features = ["full"] }
tokio-rustls  = "0.26"
rustls         = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
x509-parser    = { version = "0.18", default-features = false }
tracing       = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
bytes         = "1.5"
indexmap       = { workspace = true }
jiff           = { workspace = true }
thiserror      = { workspace = true }
metrics        = "0.24"
metrics-exporter-prometheus = "0.18"
axum           = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
serde          = { workspace = true }
serde_json     = { workspace = true }
socket2        = "0.6"
tokio-tungstenite = "0.29"
futures-util   = "0.3"

[dev-dependencies]
criterion     = { version = "0.8", features = ["html_reports"] }
tokio-test    = "0.4"
rcgen          = "0.14"
tower          = { version = "0.5", features = ["util"] }
http           = "1"
http-body-util = "0.1"

[[bench]]
name = "bolt_benchmarks"
harness = false
