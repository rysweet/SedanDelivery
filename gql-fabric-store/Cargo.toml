[package]
name    = "gql-fabric-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cypher-core    = { path = "../cypher-core" }
indexmap    = { workspace = true }
tracing     = { workspace = true }
serde_json  = "1.0"
# Lightweight synchronous HTTP — GraphStore trait is sync; no async runtime needed.
ureq        = { version = "3.3", features = ["json"] }
