[package]
name    = "gql-fabric-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gql-core    = { path = "../gql-core" }
tracing     = { workspace = true }
serde_json  = "1.0"
# Lightweight synchronous HTTP — GraphStore trait is sync; no async runtime needed.
ureq        = { version = "3.2", features = ["json"] }
