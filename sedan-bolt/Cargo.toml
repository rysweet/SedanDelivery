[package]
name    = "sedan-bolt"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "sedan-bolt"
path = "src/main.rs"

[dependencies]
gql-core      = { path = "../gql-core" }
tokio         = { version = "1", features = ["full"] }
tracing       = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes         = "1.5"
indexmap       = { workspace = true }
jiff           = { workspace = true }
thiserror      = { workspace = true }

[dev-dependencies]
tokio-test    = "0.4"
