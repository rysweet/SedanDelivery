# Standalone workspace — built separately from the main SedanDelivery workspace
# because cdylib linking requires Valkey/Redis C headers at compile time.
[workspace]

[package]
name = "sd2-valkey-module"
version = "0.1.0"
edition = "2021"
description = "Valkey module for high-performance SedanDelivery graph MERGE operations"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
valkey-module = "0.1"
serde_json = "1"

[dev-dependencies]
serde_json = "1"
