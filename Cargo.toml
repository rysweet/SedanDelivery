[workspace]
members = [
    "cypher-core",
    "sd2-redis-store",
    "gql-fabric-store",
    "sd2-redis-module",
    "gql-cli",
    "sd2-api",
    "sedandelivery-bolt",
    "sedandelivery-fabric-sync",
    "sedandelivery-gremlin",
    "sedandelivery-gremlin-server",
    "gremlin-core",
    "sedan-gql-embedded",
    "sedan-cypher-embedded",
    "sedan-gremlin-embedded",
    "tests/loadtest",
    "tests/embedded-bench",
    "tests/embedded-fuzz",
    "tests/bolt-fuzz",
    "tests/concurrent-stress",
    "tests/gremlin-tck",
    "tests/bolt-driver-conformance",
    "tests/scalability",
    "tests/soak",
    "tests/differential",
    "gql-engine",
    "examples/embedded_app",
    "examples/embedded_quickstart",
]
exclude = ["examples/embedded-consumer", "fuzz"]
resolver = "2"

[workspace.package]
version     = "0.1.0"
edition     = "2021"
license     = "MIT OR Apache-2.0"
authors     = ["SedanDelivery contributors"]
repository  = "https://github.com/rysweet/SedanDelivery"

# Shared dependency versions — all members reference these with { workspace = true }
[workspace.dependencies]
# Error handling
thiserror    = "2.0"

# Collections
indexmap     = { version = "2.0", features = ["serde"] }
rustc-hash   = "2.1"

# Parsing — hand-written recursive descent (lalrpop rejected: cannot handle Cypher's
# "|" ambiguity across label disjunction / rel-type disjunction / list comprehension)
# See ADR-003 update and Rust expert review notes.
regex = "1.10"

# Arena allocation
typed-arena  = "2.0"

# Temporal types
jiff         = "0.2"

# Short inline strings for labels, rel-types, and property keys (avoid heap alloc for <23 bytes)
smol_str     = "0.3"

# SIMD (optional — mark optional in the crate-level Cargo.toml, not here)
wide         = { version = "1.2" }

# Graph algorithms (executor use only)
# petgraph 0.6 does not have an "algo" feature — algorithms are compiled by default.
petgraph     = { version = "0.8", default-features = true }

# Serialization
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"

# Checksums — CRC32C (Castagnoli) for WAL per-record framing (#1702)
crc32c       = "0.6"

# Logging & tracing
tracing      = "0.1"
tracing-opentelemetry = "0.32"
opentelemetry = "0.31"
opentelemetry_sdk = "0.31"
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic"] }

# UUID
uuid         = { version = "1", features = ["v4", "serde"] }

# Dev / test
proptest     = "1.11"
criterion    = { version = "0.8", features = ["html_reports"] }
insta        = { version = "1.47", features = ["yaml"] }
cucumber     = "0.22"
tokio        = { version = "1", features = ["full"] }

[profile.release]
lto           = "fat"
opt-level     = 3
codegen-units = 1
# DO NOT set panic = "abort" — the .so runs in a host process (Redis/Valkey).
# An abort kills ALL clients, not just the failing query.
# Instead, every extern "C" command handler uses std::panic::catch_unwind.
# See Rust expert review note on panic safety in Redis modules.
strip         = "symbols"

[profile.dev]
opt-level = 1   # small opt for arena-heavy code

[profile.test]
opt-level = 1
