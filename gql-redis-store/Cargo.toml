[package]
name    = "gql-redis-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gql-core   = { path = "../gql-core" }
serde_json = { workspace = true }
# Pure Redis client — works with standalone Redis, Valkey, and Azure Cache for Redis.
# redis-module (cdylib) is only in gql-module; not here.
# tokio-comp is needed to resolve the async runtime enum in the redis crate;
# we use only synchronous (blocking) connections.
redis = { version = "1.0", default-features = false, features = ["tokio-comp", "r2d2", "cluster"] }
r2d2 = "0.8"
tracing = { workspace = true }
