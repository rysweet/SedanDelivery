# docker-compose.yml — Standalone Valkey for local development
#
# Usage:
#   export VALKEY_PASSWORD='change-me-for-local-dev'
#   export BOLT_PASSWORD='different-secret-if-you-do-not-want-bolt-to-reuse-valkey'  # optional
#   docker compose up -d
#   docker compose down -v
#
# Connects sedandelivery-bolt to a single Valkey 8 instance.
# No external dependencies beyond Docker.

services:
  valkey:
    image: valkey/valkey:8-bookworm
    ports:
      - "6379:6379"
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    volumes:
      - valkey-data:/data
    command: |
      sh -ec '
        test -n "$$VALKEY_PASSWORD" || { echo "VALKEY_PASSWORD is required" >&2; exit 1; }
        printf "%s\n" \
          "requirepass $$VALKEY_PASSWORD" \
          "save 60 1" \
          "loglevel notice" \
          "maxmemory 256mb" \
          "maxmemory-policy noeviction" \
          >/tmp/valkey.conf
        exec valkey-server /tmp/valkey.conf
      '
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$VALKEY_PASSWORD\" && REDISCLI_AUTH=\"$$VALKEY_PASSWORD\" valkey-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  sedandelivery-bolt:
    build:
      context: .
      dockerfile: Dockerfile.bolt
    entrypoint:
      - /bin/sh
      - -ec
      - |
        export BOLT_PASSWORD="${BOLT_PASSWORD:-$VALKEY_PASSWORD}"
        test -n "$BOLT_PASSWORD" || {
          echo "BOLT_PASSWORD or VALKEY_PASSWORD is required" >&2
          exit 1
        }
        exec sedandelivery-bolt
    ports:
      - "7687:7687"
      - "7688:7688"
    environment:
      - RUST_LOG=info
      - VALKEY_PASSWORD=${VALKEY_PASSWORD}
      - GQL_REDIS_URL=redis://:${VALKEY_PASSWORD}@valkey:6379
      - BOLT_PASSWORD=${BOLT_PASSWORD}
      - BOLT_IDLE_TIMEOUT_SECS=300
      - BOLT_MAX_CONNECTION_LIFETIME_SECS=1800
      - BOLT_MAX_CONNECTIONS=1024
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7688/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  valkey-data:
