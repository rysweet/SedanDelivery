          >/tmp/redis.conf
        exec redis-server /tmp/redis.conf
      '
    volumes:
      - redis-node-2-data:/data
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$VALKEY_PASSWORD\" && REDISCLI_AUTH=\"$$VALKEY_PASSWORD\" redis-cli -p 6379 ping"]
      interval: 3s
      timeout: 2s
      retries: 10

