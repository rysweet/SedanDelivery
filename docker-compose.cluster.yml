# docker-compose.cluster.yml — Redis Cluster (3 masters + 3 replicas)
#
# Usage:
#   export VALKEY_PASSWORD='change-me-for-local-dev'
#   export BOLT_PASSWORD='different-secret-if-you-do-not-want-bolt-to-reuse-valkey'  # optional
#   docker compose -f docker-compose.cluster.yml up -d
#   docker compose -f docker-compose.cluster.yml down -v
#
# Creates a 6-node Redis Cluster with automatic slot assignment.
# An init container waits for all nodes, then runs `redis-cli --cluster create`.

services:
  # ── Redis Cluster Nodes ────────────────────────────────────────────────────
  redis-node-1:
    image: redis:7-bookworm
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    command: |
      sh -ec '
        test -n "$$VALKEY_PASSWORD" || { echo "VALKEY_PASSWORD is required" >&2; exit 1; }
        printf "%s\n" \
          "port 6379" \
          "cluster-enabled yes" \
          "cluster-config-file nodes.conf" \
          "cluster-node-timeout 5000" \
          "masterauth $$VALKEY_PASSWORD" \
          "requirepass $$VALKEY_PASSWORD" \
          "appendonly yes" \
          "maxmemory 128mb" \
          "maxmemory-policy noeviction" \
          >/tmp/redis.conf
        exec redis-server /tmp/redis.conf
      '
    volumes:
      - redis-node-1-data:/data
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$VALKEY_PASSWORD\" && REDISCLI_AUTH=\"$$VALKEY_PASSWORD\" redis-cli -p 6379 ping"]
      interval: 3s
      timeout: 2s
      retries: 10

  redis-node-2:
    image: redis:7-bookworm
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    command: |
      sh -ec '
        test -n "$$VALKEY_PASSWORD" || { echo "VALKEY_PASSWORD is required" >&2; exit 1; }
        printf "%s\n" \
          "port 6379" \
          "cluster-enabled yes" \
          "cluster-config-file nodes.conf" \
          "cluster-node-timeout 5000" \
          "masterauth $$VALKEY_PASSWORD" \
          "requirepass $$VALKEY_PASSWORD" \
