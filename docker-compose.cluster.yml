      interval: 3s
      timeout: 2s
      retries: 10

  redis-node-4:
    image: redis:7-bookworm
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    command: |
      sh -ec '
        test -n "$$VALKEY_PASSWORD" || { echo "VALKEY_PASSWORD is required" >&2; exit 1; }
        printf "%s\n" \
