[package]
name    = "sd2-redis-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cypher-core   = { path = "../cypher-core" }
indexmap    = { workspace = true }
serde_json = { workspace = true }
# Pure Redis client — works with standalone Redis, Valkey, and Azure Cache for Redis.
# redis-module (cdylib) is only in sd2-redis-module; not here.
# tokio-comp is needed to resolve the async runtime enum in the redis crate;
# we use only synchronous (blocking) connections.
redis = { version = "1.0.5", default-features = false, features = ["tokio-comp", "r2d2", "cluster", "script"] }
r2d2 = "0.8"
uuid = { version = "1.0", features = ["v4"] }
tracing = { workspace = true }
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
tokio = { workspace = true, features = ["rt", "time"] }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name    = "batch_write"
harness = false

[[bench]]
name    = "store_safety"
harness = false
