name: QA Playwright Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/qa-playwright.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "sd2-api/**"
      - "cypher-core/**"
      - "sd2-redis-store/**"
      - "sedan-graph-ui/src/sedan-web/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/qa-playwright.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "sd2-api/**"
      - "cypher-core/**"
      - "sd2-redis-store/**"
      - "sedan-graph-ui/src/sedan-web/**"

concurrency:
  group: qa-playwright-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  playwright-e2e:
    name: Sedan Web Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.1.5

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache cargo registry
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-qa-playwright-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-qa-playwright-

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: sedan-graph-ui/src/sedan-web/package-lock.json

      - name: Install sedan-web dependencies
        working-directory: sedan-graph-ui/src/sedan-web
        run: npm ci

      - name: Install Playwright browser
        working-directory: sedan-graph-ui/src/sedan-web
        run: npx playwright install --with-deps chromium

      - name: Build sd2-api
        run: cargo build -p sd2-api

      - name: Start sd2-api
        env:
          GQL_API_BIND_ADDR: 127.0.0.1:3001
          GQL_API_ALLOWED_ORIGINS: http://localhost:5175
        run: |
          ./target/debug/sd2-api > "$RUNNER_TEMP/sd2-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/sd2-api.pid"

      - name: Wait for sd2-api
        run: |
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3001/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "sd2-api failed to become healthy"
          cat "$RUNNER_TEMP/sd2-api.log"
          exit 1

      - name: Run Playwright tests
        working-directory: sedan-graph-ui/src/sedan-web
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test --reporter=line,html

      - name: Stop background services
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/sd2-api.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/sd2-api.pid")" 2>/dev/null || true
            wait "$(cat "$RUNNER_TEMP/sd2-api.pid")" 2>/dev/null || true
          fi

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: qa-playwright-artifacts
          if-no-files-found: ignore
          retention-days: 14
          path: |
            sedan-graph-ui/src/sedan-web/playwright-report/
            sedan-graph-ui/src/sedan-web/test-results/
            ${{ runner.temp }}/sd2-api.log
