name: QA Playwright Tests (Disabled)

# This repository contains a real Playwright project under
# sedan-graph-ui/src/sedan-web, but the previous workflow file was imported
# from a Cybergym template and no longer matched SedanDelivery's test layout,
# triggers, or environment contract. Keep a valid placeholder here until a
# SedanDelivery-specific workflow is authored.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    name: Workflow disabled pending SedanDelivery port
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled status
        run: |
          echo "qa-playwright.yml is intentionally disabled."
          echo "The previous workflow was imported from a Cybergym template and"
          echo "did not match SedanDelivery's Playwright project or deployment"
          echo "contract, which caused push-time workflow-file failures."
          echo
          echo "Port a new workflow from sedan-graph-ui/src/sedan-web before"
          echo "re-enabling automated Playwright QA in this repository."
