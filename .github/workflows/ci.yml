name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Tier 1 + 2: Run on every PR and push ────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.1.5

      - name: Verify Dockerfile Cargo.lock guards
        run: bash tests/test_dockerfile_cargo_lock.sh

      - name: Validate Dockerfile publish structure
        run: bash scripts/validate-dockerfiles.sh

      - name: Build workflow Docker builder stages
        run: |
          docker build -f Dockerfile . --target builder >/tmp/dockerfile-builder.log 2>&1
          docker build -f Dockerfile.bolt . --target builder >/tmp/dockerfile-bolt-builder.log 2>&1
          docker build -f Dockerfile.sync . --target builder >/tmp/dockerfile-sync-builder.log 2>&1
          docker build -f Dockerfile.api . --target builder >/tmp/dockerfile-api-builder.log 2>&1

      # Docker builder stages each compile the full Rust workspace inside
      # isolated containers. Combined with the host-side cargo checks that
      # follow, the four sequential builds can exhaust GitHub-hosted runner
      # disk (~14 GB). Pruning all Docker layers and build cache here frees
      # that space so the subsequent cargo check --workspace can link
      # proc-macro crates (e.g. enum-primitive-derive) without a Bus Error.
      - name: Reclaim disk after Docker builds
        run: docker system prune -af --volumes

      - name: Install Rust stable with rustfmt and clippy
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache cargo registry
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # redis-module (used by sd2-redis-store and sd2-redis-module) requires libclang
      # for its bindgen build script.
      - name: Install libclang (required by redis-module bindgen)
        run: sudo apt-get update -q && sudo apt-get install -y -q libclang-dev

      # ── Tier 1: Fast checks (< 2 min) ──────────────────────────────────────
      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (deny warnings on cypher-core)
        run: cargo clippy -p cypher-core -- -D warnings

      - name: Run unit tests
        run: cargo test -p cypher-core --lib

      # ── Tier 2: Standard integration tests (< 10 min) ──────────────────────
      - name: Run integration tests (end-to-end)
        run: cargo test -p cypher-core --test end_to_end

      - name: Run integration tests (exists/interactive)
        run: cargo test -p cypher-core --test exists_interactive

      - name: Run data integrity tests
        run: cargo test -p cypher-core --test data_integrity

      - name: Run adversarial query tests
        run: cargo test -p cypher-core --test adversarial

      - name: Run embedded engine contract tests
        run: cargo test -p sedan-cypher-embedded -p sedan-gql-embedded -p sedan-gremlin-embedded

      - name: Run GQL outside-in contract tests
        run: cargo test -p gql-engine --test outside_in

      # ── sedandelivery-bolt & Fabric sync checks ─────────────────────────
      - name: Build sedandelivery-bolt
        run: cargo build -p sedandelivery-bolt

      - name: Test sedandelivery-bolt
        run: cargo test -p sedandelivery-bolt --lib

      - name: Clippy sedandelivery-bolt (deny warnings)
        run: cargo clippy -p sedandelivery-bolt -- -D warnings

      - name: Check Fabric sync compiles
        run: cargo check -p sedandelivery-fabric-sync

      - name: Check all crates compile
        run: cargo check --workspace

  sedan-web-validation:
    name: Sedan Web Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sedan-graph-ui/src/sedan-web
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.1.5

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sedan-graph-ui/src/sedan-web/package-lock.json

      - name: Install sedan-web dependencies
        run: npm ci

      - name: Lint sedan-web
        run: npm run lint

      - name: Test sedan-web
        run: npm run test:run

      - name: Build sedan-web
        run: npm run build

  # ── Tier 3: Full suite — only on push to main (< 30 min) ──────────────────
  full-suite:
    name: Full Test Suite
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.1.5

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo registry
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-full-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-full-

      - name: Install libclang
        run: sudo apt-get update -q && sudo apt-get install -y -q libclang-dev

      - name: Build entire workspace (release)
        run: cargo build --workspace --release

      - name: Run TCK compliance suite (3903 scenarios)
        # All 3903 openCypher TCK scenarios pass with zero parse errors.
        # Feature files were fixed to eliminate Gherkin template/parse issues.
        run: cargo test -p cypher-core --test tck

      - name: Run stress tests
        run: cargo test -p cypher-core --test stress

      - name: Run LDBC SNB benchmark tests
        run: cargo test -p cypher-core --test ldbc

      - name: Run Redis module simulation tests
        run: cargo test -p sd2-redis-module --test integration

      - name: Run FalkorDB compatibility tests
        run: cargo test -p sd2-redis-module --test compatibility

      - name: Testkit smoke test (sedandelivery-bolt)
        run: |
          cargo build -p sedandelivery-bolt
          # Run only the passing testkit tests; allowed to fail in CI
          bash sedandelivery-bolt/tests/testkit/run_testkit.sh --passing-only || true

  # ── Tier 3b: Valkey integration (load sd2-redis-module.so via Docker) ────────────
  valkey-integration:
    name: Valkey Module Integration
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    services:
      valkey:
        image: valkey/valkey:8.1-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.1.5

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo registry
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-valkey-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-valkey-

      - name: Install libclang
        run: sudo apt-get update -q && sudo apt-get install -y -q libclang-dev

      - name: Run protocol tests against plain Valkey
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: cargo test -p sd2-redis-module --test integration -- test_redis_protocol_skipped_without_url

  # ── Code Coverage (Tier 4 element, runs on every push) ─────────────────────
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.1.5

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install libclang (required by sd2-redis-module bindgen)
        run: sudo apt-get update -q && sudo apt-get install -y -q libclang-dev

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Generate coverage
        run: cargo tarpaulin -p cypher-core --lib --out xml --output-dir coverage/ --fail-under 70 -- --test-threads 1

      - name: Upload coverage to GitHub
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: coverage-report
          path: coverage/

  # ── Tier 4: Performance benchmarks with regression detection ────────────────
  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'perf'))
    env:
      PERF_REGRESSION_THRESHOLD: ${{ vars.PERF_REGRESSION_THRESHOLD || '10' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.1.5

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo registry
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-bench-

      - name: Install libclang
        run: sudo apt-get update -q && sudo apt-get install -y -q libclang-dev

      # ── Run all benchmarks ──────────────────────────────────────────────
      - name: Run parser benchmarks
        run: cargo bench -p cypher-core --bench parser -- --output-format bencher | tee bench-parser.txt

      - name: Run executor benchmarks
        run: cargo bench -p cypher-core --bench executor -- --output-format bencher | tee bench-executor.txt

      - name: Run scale benchmarks
        run: cargo bench -p cypher-core --bench scale -- --output-format bencher | tee bench-scale.txt

      - name: Run bolt benchmarks
        run: cargo bench -p sedandelivery-bolt --bench bolt_benchmarks -- --output-format bencher | tee bench-bolt.txt

      # Combine all results into a single file for comparison
      - name: Combine benchmark results
        run: cat bench-parser.txt bench-executor.txt bench-scale.txt bench-bolt.txt > new.txt

      # ── Regression detection ────────────────────────────────────────────
      - name: Download baseline artifact
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p baseline
          run_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=20" \
              --jq '.workflow_runs[] | select(.conclusion == "success") | .id' \
              | head -n 1
          )"

          if [ -z "$run_id" ]; then
            echo "No successful CI baseline run found on main; skipping baseline download"
            exit 0
          fi

          if ! gh run download "$run_id" -n benchmark-baseline -D baseline; then
            echo "No benchmark-baseline artifact found on run $run_id; skipping baseline comparison"
          fi

      - name: Compare against baseline
        if: github.event_name == 'pull_request'
        run: |
          if [ ! -f baseline/baseline.txt ]; then
            echo "No baseline artifact available; skipping regression comparison"
            exit 0
          fi
          bash scripts/bench-compare.sh baseline/baseline.txt new.txt "$PERF_REGRESSION_THRESHOLD"

      # ── Store baseline on main pushes ───────────────────────────────────
      - name: Prepare baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp new.txt baseline.txt

      - name: Upload baseline artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: benchmark-baseline
          path: baseline.txt
          retention-days: 90

      - name: Upload benchmark results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: benchmark-results
          path: bench-*.txt

  # ── MSRV check ───────────────────────────────────────────────────────────────
  msrv:
    # smol_str 0.3.5 requires rustc 1.89; jiff requires 1.70
    name: MSRV check (1.89.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.1.5
      - name: Install Rust 1.89.0 for MSRV check
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
          rustc --version
      - name: Cache cargo
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-msrv-
      - run: cargo check -p cypher-core
