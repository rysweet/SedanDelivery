name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Tier 1 + 2: Run on every PR and push ────────────────────────────────────
  test:
    name: Test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.1.5

      - name: Install Rust stable with rustfmt and clippy
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # redis-module (used by gql-redis-store and gql-module) requires libclang
      # for its bindgen build script.
      - name: Install libclang (required by redis-module bindgen)
        run: sudo apt-get update -q && sudo apt-get install -y -q libclang-dev

      # ── Tier 1: Fast checks (< 2 min) ──────────────────────────────────────
      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (deny warnings on gql-core)
        run: cargo clippy -p gql-core -- -D warnings

      - name: Run unit tests
        run: cargo test -p gql-core --lib

      # ── Tier 2: Standard integration tests (< 10 min) ──────────────────────
      - name: Run integration tests (end-to-end)
        run: cargo test -p gql-core --test end_to_end

      - name: Run integration tests (exists/interactive)
        run: cargo test -p gql-core --test exists_interactive

      - name: Run data integrity tests
        run: cargo test -p gql-core --test data_integrity

      - name: Run adversarial query tests
        run: cargo test -p gql-core --test adversarial

      # ── sedandelivery-bolt & Fabric sync checks ─────────────────────────
      - name: Build sedandelivery-bolt
        run: cargo build -p sedandelivery-bolt

      - name: Test sedandelivery-bolt
        run: cargo test -p sedandelivery-bolt --lib

      - name: Clippy sedandelivery-bolt (deny warnings)
        run: cargo clippy -p sedandelivery-bolt -- -D warnings

      - name: Check Fabric sync compiles
        run: cargo check -p sedandelivery-fabric-sync

      - name: Check all crates compile
        run: cargo check --workspace

  # ── Tier 3: Full suite — only on push to main (< 30 min) ──────────────────
  full-suite:
    name: Full Test Suite
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.1.5

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-full-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-full-

      - name: Install libclang
        run: sudo apt-get update -q && sudo apt-get install -y -q libclang-dev

      - name: Run TCK compliance suite (3903 scenarios)
        # All 3903 openCypher TCK scenarios pass with zero parse errors.
        # Feature files were fixed to eliminate Gherkin template/parse issues.
        run: cargo test -p gql-core --test tck

      - name: Run stress tests
        run: cargo test -p gql-core --test stress

      - name: Run LDBC SNB benchmark tests
        run: cargo test -p gql-core --test ldbc

      - name: Run Redis module simulation tests
        run: cargo test -p gql-module --test integration

      - name: Run FalkorDB compatibility tests
        run: cargo test -p gql-module --test compatibility

      - name: Testkit smoke test (sedandelivery-bolt)
        run: |
          cargo build -p sedandelivery-bolt
          # Run only the passing testkit tests; allowed to fail in CI
          bash sedandelivery-bolt/tests/testkit/run_testkit.sh --passing-only || true

  # ── Tier 3b: Valkey integration (load gql-module.so via Docker) ────────────
  valkey-integration:
    name: Valkey Module Integration
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    services:
      valkey:
        image: valkey/valkey:8.1-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.1.5

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-valkey-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-valkey-

      - name: Install libclang
        run: sudo apt-get update -q && sudo apt-get install -y -q libclang-dev

      - name: Run protocol tests against plain Valkey
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: cargo test -p gql-module --test integration -- test_redis_protocol_skipped_without_url

  # ── Code Coverage (Tier 4 element, runs on every push) ─────────────────────
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.1.5

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install libclang (required by gql-module bindgen)
        run: sudo apt-get update -q && sudo apt-get install -y -q libclang-dev

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Generate coverage
        run: cargo tarpaulin -p gql-core --lib --out xml --output-dir coverage/ -- --test-threads 1

      - name: Check coverage threshold
        run: |
          COVERAGE=$(cargo tarpaulin -p gql-core --lib --print-rust-flags 2>&1 | grep "coverage:" | awk '{print $2}' | sed 's/%//')
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "FAIL: Coverage $COVERAGE% is below 70% threshold"
            exit 1
          fi

      - name: Upload coverage to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # ── Tier 4: Nightly benchmarks (scheduled) ──────────────────────────────────
  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.1.5

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-bench-

      - name: Install libclang
        run: sudo apt-get update -q && sudo apt-get install -y -q libclang-dev

      - name: Run parser benchmarks
        run: cargo bench -p gql-core --bench parser -- --output-format bencher | tee bench-parser.txt

      - name: Run executor benchmarks
        run: cargo bench -p gql-core --bench executor -- --output-format bencher | tee bench-executor.txt

      - name: Run scale benchmarks
        run: cargo bench -p gql-core --bench scale -- --output-format bencher | tee bench-scale.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: "*.txt"

  # ── MSRV check ───────────────────────────────────────────────────────────────
  msrv:
    # smol_str 0.3.5 requires rustc 1.89; jiff requires 1.70
    name: MSRV check (1.89.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.1.5
      - name: Install Rust 1.89.0 for MSRV check
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
          rustc --version
      - run: cargo check -p gql-core
