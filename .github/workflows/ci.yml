name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Tier 1 + 2: Run on every PR and push ────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.1.5

      - name: Verify Dockerfile Cargo.lock guards
        run: bash tests/test_dockerfile_cargo_lock.sh

      - name: Validate Dockerfile publish structure
        run: bash scripts/validate-dockerfiles.sh

      - name: Build workflow Docker builder stages
        # Each Dockerfile builds the full Rust workspace in an isolated builder
        # stage. The four builds are sequential so a failure in any one of them
        # short-circuits the rest. Output is captured per file so the job log
        # stays scannable; the "Show Docker builder logs on failure" step below
        # surfaces the failing log when this step exits non-zero.
        run: |
          set -e
          run_build() {
            local file="$1" log="$2"
            echo "::group::docker build -f $file . --target builder"
            if docker build -f "$file" . --target builder > "$log" 2>&1; then
              echo "OK ($file)"
              echo "::endgroup::"
            else
              local rc=$?
              echo "::endgroup::"
              echo "::error file=$file::Docker builder stage for $file failed (exit $rc); see following log dump"
              echo "----- BEGIN $log -----"
              cat "$log"
              echo "-----  END  $log -----"
              return $rc
            fi
          }
          run_build Dockerfile        /tmp/dockerfile-builder.log
          run_build Dockerfile.bolt   /tmp/dockerfile-bolt-builder.log
          run_build Dockerfile.sync   /tmp/dockerfile-sync-builder.log
          run_build Dockerfile.api    /tmp/dockerfile-api-builder.log

      - name: Upload Docker builder logs on failure
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: dockerfile-builder-logs
          path: |
            /tmp/dockerfile-builder.log
            /tmp/dockerfile-bolt-builder.log
            /tmp/dockerfile-sync-builder.log
            /tmp/dockerfile-api-builder.log
          if-no-files-found: ignore
          retention-days: 7

      # Docker builder stages each compile the full Rust workspace inside
      # isolated containers. Combined with the host-side cargo checks that
      # follow, the four sequential builds can exhaust GitHub-hosted runner
      # disk (~14 GB). Pruning all Docker layers and build cache here frees
      # that space so the subsequent cargo check --workspace can link
      # proc-macro crates (e.g. enum-primitive-derive) without a Bus Error.
      - name: Reclaim disk after Docker builds
        run: docker system prune -af --volumes

      - name: Install Rust stable with rustfmt and clippy
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache cargo registry
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # redis-module (used by sd2-redis-store and sd2-redis-module) requires libclang
      # for its bindgen build script.
      - name: Install libclang (required by redis-module bindgen)
        run: sudo apt-get update -q && sudo apt-get install -y -q libclang-dev

      # ── Tier 1: Fast checks (< 2 min) ──────────────────────────────────────
      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (deny warnings on cypher-core)
        run: cargo clippy -p cypher-core -- -D warnings

      - name: Run unit tests
        run: cargo test -p cypher-core --lib

      # ── Tier 2: Standard integration tests (< 10 min) ──────────────────────
      - name: Run integration tests (end-to-end)
        run: cargo test -p cypher-core --test end_to_end

      - name: Run integration tests (exists/interactive)
        run: cargo test -p cypher-core --test exists_interactive

      - name: Run data integrity tests
        run: cargo test -p cypher-core --test data_integrity

      - name: Run adversarial query tests
        run: cargo test -p cypher-core --test adversarial

      - name: Run embedded engine contract tests
        run: cargo test -p sedan-cypher-embedded -p sedan-gql-embedded -p sedan-gremlin-embedded

      - name: Run embedded engine doctests
        # Documentation examples are the primary onboarding surface for
        # downstream consumers — every // ``` rust example must stay
        # compilable and correct.
        run: cargo test --doc -p sedan-cypher-embedded -p sedan-gql-embedded -p sedan-gremlin-embedded

      - name: Run full gql-engine test suite
        # Includes outside_in, concurrency, value_pressure, fuzz_rewrite,
        # parity, and unit_parser — all of which exercise gql-engine's public
        # API and are wrapped one-for-one by sedan-gql-embedded::SedanGql.
        run: cargo test -p gql-engine

      - name: Run Gremlin TCK (DEPRECATED — moved to gremlin-tck job)
        # Kept for change-history visibility; the active TCK run is the
        # standalone `gremlin-tck` job below. Step is permanently disabled.
        run: 'true # noop — TCK runs in gremlin-tck job'

      # ── sedandelivery-bolt & Fabric sync checks ─────────────────────────
      - name: Build sedandelivery-bolt
        run: cargo build -p sedandelivery-bolt

      - name: Test sedandelivery-bolt
        run: cargo test -p sedandelivery-bolt --lib

      - name: Clippy sedandelivery-bolt (deny warnings)
        run: cargo clippy -p sedandelivery-bolt -- -D warnings

      - name: Check Fabric sync compiles
        run: cargo check -p sedandelivery-fabric-sync

      - name: Check all crates compile
        run: cargo check --workspace

  # ── Gremlin TCK on its own runner ──────────────────────────────────────────
  # Moved out of `test` job because the 1672 scenarios + Docker builder stages
  # together exceeded GitHub-hosted runner memory/disk budget, causing SIGTERM
  # at ~9 min into TCK run (#1692). On a fresh runner with --release build
  # and rust-cache, TCK completes in <5 min.
  gremlin-tck:
    name: Gremlin TCK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 1672 scenarios sharded across the 7 top-level feature subdirectories so
    # no single runner exhausts the GH-hosted 7GB-RAM/14GB-disk budget. Each
    # shard runs the cucumber binary against just one subdirectory via the
    # GREMLIN_TCK_FEATURES env var. The optional GREMLIN_TCK_FILE_PREFIXES
    # env var supports finer sub-shard splits if a single subdirectory ever
    # outgrows a single runner. Tracked in #1697.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: branch,     dir: branch,     prefixes: "" }
          - { shard: data,       dir: data,       prefixes: "" }
          - { shard: filter,     dir: filter,     prefixes: "" }
          - { shard: integrated, dir: integrated, prefixes: "" }
          - { shard: map,        dir: map,        prefixes: "" }
          - { shard: semantics,  dir: semantics,  prefixes: "" }
          - { shard: sideEffect, dir: sideEffect, prefixes: "" }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.1.5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo registry + target
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: gremlin-tck-release-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            gremlin-tck-release-${{ runner.os }}-

      - name: Run Gremlin TCK shard (${{ matrix.shard }})
        run: cargo test -p gremlin-tck --test gremlin_tck --release -- --concurrency 1
        env:
          RUST_MIN_STACK: "8388608"
          GREMLIN_TCK_FEATURES: features/${{ matrix.dir }}
          GREMLIN_TCK_FILE_PREFIXES: ${{ matrix.prefixes }}

  sedan-web-validation:
    name: Sedan Web Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sedan-graph-ui/src/sedan-web
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.1.5

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sedan-graph-ui/src/sedan-web/package-lock.json

      - name: Install sedan-web dependencies
        run: npm ci

      - name: Lint sedan-web
        run: npm run lint

      - name: Test sedan-web
        run: npm run test:run

      - name: Build sedan-web
        run: npm run build

  # ── Tier 3: Full suite — only on push to main (< 30 min) ──────────────────
  full-suite:
    name: Full Test Suite
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.1.5

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo registry
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-full-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-full-

      - name: Install libclang
        run: sudo apt-get update -q && sudo apt-get install -y -q libclang-dev

      - name: Build entire workspace (release)
        run: cargo build --workspace --release

      - name: Run TCK compliance suite (3903 scenarios)
        # All 3903 openCypher TCK scenarios pass with zero parse errors.
        # Feature files were fixed to eliminate Gherkin template/parse issues.
        run: cargo test -p cypher-core --test tck

      - name: Run TCK compliance suite via embedded crate (3903 scenarios)
        # Proves sedan-cypher-embedded::CypherEngine's public API
        # (execute_with_parameters) is fully compliant with the openCypher TCK.
        # Same .feature files are symlinked from cypher-core; this guards
        # against the embedded crate drifting from the underlying engine.
        run: cargo test -p sedan-cypher-embedded --test tck_via_embedded

      - name: Run Gremlin TCK via embedded crate (sedan-gremlin-embedded)
        # Proves sedan-gremlin-embedded::GremlinEngine's public API is fully
        # equivalent to the underlying gremlin-core + cypher-core pipeline
        # against the canonical TinkerPop "modern" graph fixture.
        run: cargo test -p sedan-gremlin-embedded --test tck_via_embedded

      - name: Run GQL conformance via embedded crate (sedan-gql-embedded)
        # Proves sedan-gql-embedded::SedanGql's public API matches the raw
        # gql-engine pipeline (and, for shared syntax, sedan-cypher-embedded)
        # across the conformance scenarios mirrored from the openCypher TCK.
        run: cargo test -p sedan-gql-embedded --test tck_via_embedded

      - name: Run stress tests
        run: cargo test -p cypher-core --test stress

      - name: Run LDBC SNB benchmark tests
        run: cargo test -p cypher-core --test ldbc

      - name: Run Redis module simulation tests
        run: cargo test -p sd2-redis-module --test integration

      - name: Run FalkorDB compatibility tests
        run: cargo test -p sd2-redis-module --test compatibility

      - name: Testkit smoke test (sedandelivery-bolt)
        run: |
          cargo build -p sedandelivery-bolt
          # Run only the passing testkit tests; allowed to fail in CI
          bash sedandelivery-bolt/tests/testkit/run_testkit.sh --passing-only || true

  # ── Tier 3b: Valkey integration (load sd2-redis-module.so via Docker) ────────────
  valkey-integration:
    name: Valkey Module Integration
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    services:
      valkey:
        image: valkey/valkey:8.1-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.1.5

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo registry
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-valkey-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-valkey-

      - name: Install libclang
        run: sudo apt-get update -q && sudo apt-get install -y -q libclang-dev

      - name: Run protocol tests against plain Valkey
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: cargo test -p sd2-redis-module --test integration -- test_redis_protocol_skipped_without_url

  # ── Code Coverage (Tier 4 element, runs on every push) ─────────────────────
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.1.5

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install libclang (required by sd2-redis-module bindgen)
        run: sudo apt-get update -q && sudo apt-get install -y -q libclang-dev

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Generate coverage
        run: cargo tarpaulin -p cypher-core --lib --out xml --output-dir coverage/ --fail-under 70 -- --test-threads 1

      - name: Coverage floor check (do not regress baseline)
        # Per-crate floor enforcement against the values recorded in
        # docs/COVERAGE.md "Baseline (2026-04-19, refreshed post-#1357)".
        # Allows a 1pt tolerance for measurement noise; fails the job
        # if any tracked crate drops below floor − tolerance.
        run: bash scripts/coverage_floor_check.sh

      - name: Upload coverage to GitHub
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: coverage-report
          path: coverage/

  # ── Tier 4: Performance benchmarks with regression detection ────────────────
  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'perf'))
    env:
      PERF_REGRESSION_THRESHOLD: ${{ vars.PERF_REGRESSION_THRESHOLD || '10' }}
      GQL_REDIS_URL: redis://127.0.0.1:6379
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.1.5

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo registry
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-bench-

      - name: Install libclang
        run: sudo apt-get update -q && sudo apt-get install -y -q libclang-dev

      # ── Run all benchmarks ──────────────────────────────────────────────
      - name: Run parser benchmarks
        run: cargo bench -p cypher-core --bench parser -- --output-format bencher | tee bench-parser.txt

      - name: Run executor benchmarks
        run: cargo bench -p cypher-core --bench executor -- --output-format bencher | tee bench-executor.txt

      - name: Run scale benchmarks
        run: cargo bench -p cypher-core --bench scale -- --output-format bencher | tee bench-scale.txt

      - name: Run property_index benchmarks
        run: cargo bench -p cypher-core --bench property_index -- --output-format bencher | tee bench-property-index.txt

      - name: Run bolt benchmarks
        run: cargo bench -p sedandelivery-bolt --bench bolt_benchmarks -- --output-format bencher | tee bench-bolt.txt

      - name: Run redis batch_write benchmarks
        run: cargo bench -p sd2-redis-store --bench batch_write -- --output-format bencher | tee bench-batch-write.txt

      - name: Run redis store_safety benchmarks
        run: cargo bench -p sd2-redis-store --bench store_safety -- --output-format bencher | tee bench-store-safety.txt

      # Combine all results into a single file for comparison
      - name: Combine benchmark results
        run: cat bench-parser.txt bench-executor.txt bench-scale.txt bench-property-index.txt bench-bolt.txt bench-batch-write.txt bench-store-safety.txt > new.txt

      # ── Regression detection ────────────────────────────────────────────
      - name: Download baseline artifact
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p baseline
          run_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=20" \
              --jq '.workflow_runs[] | select(.conclusion == "success") | .id' \
              | head -n 1
          )"

          if [ -z "$run_id" ]; then
            echo "No successful CI baseline run found on main; skipping baseline download"
            exit 0
          fi

          if ! gh run download "$run_id" -n benchmark-baseline -D baseline; then
            echo "No benchmark-baseline artifact found on run $run_id; skipping baseline comparison"
          fi

      - name: Compare against baseline
        if: github.event_name == 'pull_request'
        run: |
          if [ ! -f baseline/baseline.txt ]; then
            echo "No baseline artifact available; skipping regression comparison"
            exit 0
          fi
          bash scripts/bench-compare.sh baseline/baseline.txt new.txt "$PERF_REGRESSION_THRESHOLD"

      # ── Store baseline on main pushes ───────────────────────────────────
      - name: Prepare baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp new.txt baseline.txt

      - name: Upload baseline artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: benchmark-baseline
          path: baseline.txt
          retention-days: 90

      - name: Upload benchmark results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: benchmark-results
          path: bench-*.txt

  # ── MSRV check ───────────────────────────────────────────────────────────────
  msrv:
    # smol_str 0.3.5 requires rustc 1.89; jiff requires 1.70
    name: MSRV check (1.89.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.1.5
      - name: Install Rust 1.89.0 for MSRV check
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
          rustc --version
      - name: Cache cargo
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-msrv-
      - run: cargo check -p cypher-core
