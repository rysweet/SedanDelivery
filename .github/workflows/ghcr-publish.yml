name: Publish Container Images to GHCR

# Build and publish all SedanDelivery container images to GitHub Container
# Registry (ghcr.io) on every push to main, on version tags, and on manual
# dispatch. Uses GITHUB_TOKEN for publishing and GH_AW_GITHUB_TOKEN to set
# package visibility explicitly after publish.
#
# Images:
#   ghcr.io/cloud-ecosystem-security/sedandelivery           — Valkey + GQL module
#   ghcr.io/cloud-ecosystem-security/sedandelivery-bolt       — Bolt protocol server
#   ghcr.io/cloud-ecosystem-security/sedandelivery-sync       — Legacy Fabric sync alias
#   ghcr.io/cloud-ecosystem-security/sedandelivery-fabric-sync — Fabric sync sidecar
#
# Closes #433

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ghcr-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/sedandelivery

jobs:
  build-and-push:
    name: Build & Push (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: sedandelivery
            dockerfile: Dockerfile
            suffix: ""
            description: "SedanDelivery — Valkey server with GQL graph module"
          - image: sedandelivery-bolt
            dockerfile: Dockerfile.bolt
            suffix: "-bolt"
            description: "SedanDelivery Bolt — Neo4j Bolt protocol server"
          - image: sedandelivery-fabric-sync
            dockerfile: Dockerfile.sync
            suffix: "-fabric-sync"
            description: "SedanDelivery Fabric Sync — Microsoft Fabric graph sync sidecar"
          - image: sedandelivery-sync
            dockerfile: Dockerfile.sync
            suffix: "-sync"
            description: "SedanDelivery Sync — compatibility alias for the Fabric sync sidecar"

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.1.5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.IMAGE_BASE }}${{ matrix.suffix }}
          tags: |
            # On push to main: tag as "latest" and date-based "YYYYMMDD"
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD'}},enable={{is_default_branch}}
            # On version tags (v1.2.3): use the version string
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Always tag with the short SHA for traceability
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Make package public
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_AW_GITHUB_TOKEN is required to set GHCR package visibility."
            exit 1
          fi

          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/orgs/${{ github.repository_owner }}/packages/container/${{ matrix.image }}/visibility" \
            -f visibility=public
