name: Graph Services CI/CD

on:
  push:
    branches:
      - main
      - 'feat/issue-208-*'
    paths:
      - 'src/CyberGym.Graph*/**'
      - 'src/CyberGym.Aad*/**'
      - 'src/CyberGym.Resource*/**'
      - 'src/CyberGym.Relationship*/**'
      - 'src/CyberGym.AppHost/**'
      - 'tests/**'
      - '*.sln'
      - '.github/workflows/graph-services-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/CyberGym.Graph*/**'
      - 'src/CyberGym.Aad*/**'
      - 'src/CyberGym.Resource*/**'
      - 'src/CyberGym.Relationship*/**'
      - 'src/CyberGym.AppHost/**'
      - 'tests/**'
      - '*.sln'

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_FILE: 'CyberGym.sln'
  BUILD_CONFIGURATION: 'Release'

jobs:
  build-and-test:
    name: Build and Unit Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_FILE }} --no-restore --configuration ${{ env.BUILD_CONFIGURATION }}

      - name: Run unit tests
        run: |
          dotnet test ${{ env.SOLUTION_FILE }} \
            --no-build \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --filter "Category!=Integration" \
            --logger "trx;LogFileName=unit-test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040 # v2.23.0
        if: always()
        with:
          trx_files: '**/unit-test-results.trx'
          check_name: Unit Test Results
          fail_on: test failures

      - name: Generate code coverage report
        if: always()
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool || true
          reportgenerator \
            -reports:./TestResults/**/coverage.opencover.xml \
            -targetdir:./TestResults/coverage-report \
            -reporttypes:"Html;Cobertura;MarkdownSummaryGithub" \
            -verbosity:Info

      - name: Add coverage summary to PR
        if: github.event_name == 'pull_request' && always()
        run: |
          if [ -f ./TestResults/coverage-report/SummaryGithub.md ]; then
            cat ./TestResults/coverage-report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./TestResults/**/coverage.opencover.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ./TestResults/coverage-report/
          retention-days: 30

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-and-test

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_FILE }} --no-restore --configuration ${{ env.BUILD_CONFIGURATION }}

      - name: Run integration tests
        run: |
          dotnet test tests/CyberGym.Integration.Tests/CyberGym.Integration.Tests.csproj \
            --no-build \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --logger "trx;LogFileName=integration-test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
        env:
          # Testcontainers configuration
          TESTCONTAINERS_RYUK_DISABLED: false
          TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ""

      - name: Publish integration test results
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040 # v2.23.0
        if: always()
        with:
          trx_files: '**/integration-test-results.trx'
          check_name: Integration Test Results
          fail_on: test failures

      - name: Upload integration test coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./TestResults/**/coverage.opencover.xml
          flags: integrationtests
          name: codecov-integration
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: build-and-test

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Run security audit
        run: |
          dotnet list ${{ env.SOLUTION_FILE }} package --vulnerable --include-transitive 2>&1 | tee vulnerability-report.txt
          if grep -q "has the following vulnerable packages" vulnerability-report.txt; then
            echo "::warning::Vulnerable packages detected. Review vulnerability-report.txt"
          fi

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: vulnerability-report.txt
          retention-days: 30

  deploy-dev:
    name: Deploy to Development
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - integration-tests
      - security-scan

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Azure Developer CLI
        uses: azure/setup-azd@v1.0.0

      - name: Azure Login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy with Aspire
        id: deploy
        working-directory: ./src/CyberGym.AppHost
        run: |
          azd init --from-code --environment dev --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" || true
          azd up --environment dev --no-prompt
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ENV_NAME: SedanDelivery-graph-dev
          AZURE_LOCATION: eastus2

      - name: Upload deployment logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-logs
          path: |
            **/.azure/**/*.log
            **/azd-*.log
          retention-days: 14

  notification:
    name: Workflow Notification
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - integration-tests
      - security-scan
    if: always()

    permissions: {}

    steps:
      - name: Check workflow status
        run: |
          echo "Build Status: ${{ needs.build-and-test.result }}"
          echo "Integration Tests Status: ${{ needs.integration-tests.result }}"
          echo "Security Scan Status: ${{ needs.security-scan.result }}"

          if [ "${{ needs.build-and-test.result }}" != "success" ] || \
             [ "${{ needs.integration-tests.result }}" != "success" ]; then
            echo "::error::CI pipeline failed. Check the logs above."
            exit 1
          fi
