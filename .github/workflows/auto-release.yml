name: Auto Release

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  release:
    name: Create Release Tag
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Generate version tag
        id: tag
        run: |
          # Get the latest tag matching vYYYY.MM.DD pattern, or start fresh
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}' | head -1 || echo "")
          TODAY="v$(date -u +'%Y.%m.%d')"

          if [[ "$LATEST_TAG" == "${TODAY}"* ]]; then
            # Increment the build number for same-day releases
            BUILD=$(echo "$LATEST_TAG" | grep -oP '\.\d+$' || echo ".0")
            BUILD_NUM=${BUILD#.}
            NEXT_BUILD=$((BUILD_NUM + 1))
            TAG="${TODAY}.${NEXT_BUILD}"
          else
            TAG="${TODAY}.1"
          fi

          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Creating release: ${TAG}"

      - name: Generate release notes
        id: notes
        run: |
          # Get commits since last tag
          LAST_TAG=$(git tag --sort=-v:refname | head -1 || echo "")
          if [ -n "$LAST_TAG" ]; then
            NOTES=$(git --no-pager log --oneline "${LAST_TAG}..HEAD" | head -50)
          else
            NOTES=$(git --no-pager log --oneline -20)
          fi
          # Write to file to handle multi-line safely
          echo "$NOTES" > /tmp/release-notes.txt

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom-spdx.json

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-cyclonedx.json

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          TAG="${RELEASE_TAG}"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "Release ${TAG}" \
            --notes-file /tmp/release-notes.txt \
            --target main \
            sbom-spdx.json \
            sbom-cyclonedx.json
          echo "Released ${TAG} with SBOM artifacts"
