name: Architecture Rules Check

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**/*.cs'
      - 'tests/CyberGym.ArchitectureRules.Tests/**'
      - '.github/workflows/architecture-rules-check.yml'
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**/*.cs'
      - 'tests/CyberGym.ArchitectureRules.Tests/**'
      - '.github/workflows/architecture-rules-check.yml'
  workflow_dispatch:

jobs:
  architecture-tests:
    name: Run Architecture Rules Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CyberGym.sln

      - name: Build solution
        run: dotnet build CyberGym.sln --configuration Release --no-restore

      - name: Run architecture rules tests
        run: |
          dotnet test tests/CyberGym.ArchitectureRules.Tests/CyberGym.ArchitectureRules.Tests.csproj \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=architecture-test-results.trx" \
            --logger "console;verbosity=detailed"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: architecture-test-results
          path: '**/architecture-test-results.trx'
          retention-days: 30

      - name: Test Report
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040 # v2.23.0
        if: always()
        with:
          trx_files: '**/architecture-test-results.trx'
          check_name: Architecture Rules Test Results
          fail_on: test failures

  report-violations:
    name: Report Architecture Violations
    runs-on: ubuntu-latest
    needs: architecture-tests
    if: failure()

    permissions:
      pull-requests: write

    steps:
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ⚠️ Architecture Rules Violation Detected

            The architecture rules tests have failed. This means your changes violate one or more architectural constraints.

            ### What to do:
            1. Review the test failures in the workflow logs above
            2. Identify which architectural rule was violated
            3. Refactor your code to comply with the architecture
            4. Review the [Architecture Rules README](https://github.com/${context.repo.owner}/${context.repo.repo}/tree/main/tests/CyberGym.ArchitectureRules.Tests/README.md) for guidance

            ### Common violations:
            - Controllers directly accessing the Data layer (should go through Services)
            - Circular dependencies between layers
            - Naming convention violations (interfaces not starting with 'I', async methods missing 'Async' suffix)
            - Services depending on Controllers

            If you believe this is a false positive or need to discuss an architectural exception, please comment on this PR.`
            })

  summary:
    name: Architecture Check Summary
    runs-on: ubuntu-latest
    needs: architecture-tests
    if: success()

    permissions:
      contents: read

    steps:
      - name: Success message
        run: |
          echo "✅ All architecture rules passed!"
          echo "The code changes comply with CyberGym architectural standards."
