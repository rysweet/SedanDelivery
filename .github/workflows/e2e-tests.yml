name: E2E Tests

on:
  pull_request:
    branches: [ "main", "integration" ]
    paths:
      - 'src/CyberGym*/**'
      - 'tests/CyberGym*/**'
      - '**/CyberGym*.sln'
  push:
    branches: [ "main", "integration" ]
    paths:
      - 'src/CyberGym*/**'
      - 'tests/CyberGym*/**'
      - '**/CyberGym*.sln'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  archived:
    name: Archived workflow
    runs-on: ubuntu-latest
    steps:
      - name: Explain archival status
        run: |
          echo "Legacy CyberGym E2E workflow archived."
          echo "SedanDelivery outside-in validation now lives in tests/qa/gadugi and qa-playwright."
