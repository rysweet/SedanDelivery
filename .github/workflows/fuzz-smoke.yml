name: fuzz-smoke

# Short (~3 minute) fuzz smoke run across all parser targets. Manually
# triggered or scheduled — NOT a required PR check, because nightly Rust is
# not part of the default workspace toolchain.
#
# To run on a PR, add the `run-fuzz` label or trigger via workflow_dispatch.

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
  schedule:
    # Daily at 06:30 UTC
    - cron: '30 6 * * *'

jobs:
  smoke:
    if: >
      github.event_name != 'pull_request' ||
      github.event.label.name == 'run-fuzz'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.1.5

      - name: Install nightly Rust
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup default nightly

      - name: Cache cargo registry + fuzz target build
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-fuzz
            fuzz/target
          key: fuzz-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.toml', 'cypher-core/**/*.rs', 'gql-engine/**/*.rs', 'gremlin-core/**/*.rs') }}
          restore-keys: |
            fuzz-${{ runner.os }}-

      - name: Install cargo-fuzz
        run: |
          if ! command -v cargo-fuzz >/dev/null 2>&1; then
            cargo install cargo-fuzz
          fi

      - name: Smoke fuzz (60s × 3 targets)
        env:
          FUZZ_TIME: '60'
        run: bash scripts/fuzz_smoke.sh

      - name: Upload crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: fuzz-crash-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
