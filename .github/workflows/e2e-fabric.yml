name: Fabric E2E Validation

# Validates the full SedanDelivery -> Fabric Graph replication pipeline
# by writing test data via Bolt, waiting for the sedandelivery-fabric-sync
# sidecar to replicate, then verifying all 8 property types and relationships
# appear correctly in the Fabric Graph Database.
#
# Triggers:
#   - After a successful "Deploy SedanDelivery" workflow run
#   - Manual dispatch specifying the target environment

on:
  workflow_run:
    workflows: ["Deploy SedanDelivery"]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to validate (e.g. main, pr-42, branch-name)'
        required: true
        type: string
      timeout:
        description: 'Max seconds to wait for Fabric sync'
        required: false
        type: number
        default: 120

env:
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

jobs:
  validate:
    name: Validate Fabric Replication
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' ||
      github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install neo4j requests
          sudo apt-get update -q && sudo apt-get install -y -q redis-tools

      - name: Azure login
        run: |
          az login \
            --service-principal \
            --username "${{ env.AZURE_CLIENT_ID }}" \
            --password "${{ secrets.AZURE_CLIENT_SECRET }}" \
            --tenant "${{ env.AZURE_TENANT_ID }}" \
            --output none
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          echo "✅ Authenticated to Azure"

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV_NAME="${{ inputs.environment }}"
          else
            # Derive env name from the deploy workflow's head branch, matching
            # the sanitisation logic in deploy.yml.
            RAW_BRANCH="${{ github.event.workflow_run.head_branch }}"
            if [[ "${RAW_BRANCH}" == "main" ]]; then
              ENV_NAME="main"
            else
              ENV_NAME=$(echo "${RAW_BRANCH}" | sed 's/[^a-zA-Z0-9-]/-/g' | tr '[:upper:]' '[:lower:]' | cut -c1-20 | sed 's/^-*//;s/-*$//')
              if [[ -z "${ENV_NAME}" ]]; then
                ENV_NAME="deploy"
              fi
            fi
          fi

          echo "env_name=${ENV_NAME}" >> "$GITHUB_OUTPUT"
          echo "resource_group=rg-sd2-${ENV_NAME}" >> "$GITHUB_OUTPUT"
          echo "Environment: ${ENV_NAME}"

      - name: Get deployment endpoints
        id: endpoints
        env:
          RG: ${{ steps.env.outputs.resource_group }}
          ENV_NAME: ${{ steps.env.outputs.env_name }}
        run: |
          CA_NAME="sd2-${ENV_NAME}-redis"

          # Get the container app's external FQDN (external TCP ingress via custom VNet)
          FQDN=$(az containerapp show \
            --name "${CA_NAME}" \
            --resource-group "${RG}" \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv 2>/dev/null || echo "")

          if [[ -z "${FQDN}" ]]; then
            echo "::error::Could not resolve FQDN for ${CA_NAME} in ${RG}"
            exit 1
          fi

          # Verify ingress is external (not internal-only)
          INGRESS_EXTERNAL=$(az containerapp show \
            --name "${CA_NAME}" \
            --resource-group "${RG}" \
            --query "properties.configuration.ingress.external" \
            --output tsv 2>/dev/null || echo "false")
          if [[ "${INGRESS_EXTERNAL}" != "true" ]]; then
            echo "::warning::Ingress is not external — Bolt endpoint may not be reachable from CI"
          fi

          echo "redis_host=${FQDN}" >> "$GITHUB_OUTPUT"
          echo "FQDN: ${FQDN} (Redis:6379)"

          # Get the standalone Bolt container app FQDN
          BOLT_CA_NAME="sd2-${ENV_NAME}-bolt"
          BOLT_FQDN=$(az containerapp show \
            --name "${BOLT_CA_NAME}" \
            --resource-group "${RG}" \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv 2>/dev/null || echo "")
          if [[ -n "${BOLT_FQDN}" ]]; then
            echo "bolt_uri=bolt://${BOLT_FQDN}:7687" >> "$GITHUB_OUTPUT"
            echo "Bolt: bolt://${BOLT_FQDN}:7687"
          else
            echo "::warning::Bolt container app not found — E2E will use redis-cli only"
          fi

          # Retrieve Valkey password for redis-cli auth
          VALKEY_PASS=$(az containerapp secret show \
            --name "${CA_NAME}" --resource-group "${RG}" \
            --secret-name valkey-password --query value -o tsv 2>/dev/null || echo "")
          if [[ -n "${VALKEY_PASS}" ]]; then
            echo "::add-mask::${VALKEY_PASS}"
            echo "redis_password=${VALKEY_PASS}" >> "$GITHUB_OUTPUT"
          fi

          # Retrieve Fabric IDs from the sync sidecar's env vars
          FABRIC_ENDPOINT=$(az containerapp show \
            --name "sd2-${ENV_NAME}-fabric-sync" \
            --resource-group "${RG}" \
            --query "properties.template.containers[0].env[?name=='GQL_FABRIC_ENDPOINT'].value | [0]" \
            --output tsv 2>/dev/null || echo "")

          if [[ -z "${FABRIC_ENDPOINT}" ]]; then
            echo "::warning::Could not resolve Fabric endpoint — Fabric sync may not be deployed"
            echo "has_fabric=false" >> "$GITHUB_OUTPUT"
          else
            echo "fabric_endpoint=${FABRIC_ENDPOINT}" >> "$GITHUB_OUTPUT"
            echo "has_fabric=true" >> "$GITHUB_OUTPUT"

            # Extract workspace ID and GraphModel ID from the endpoint URL
            # Format: .../workspaces/{ws}/GraphModels/{gm}
            FABRIC_WS_ID=$(echo "${FABRIC_ENDPOINT}" | grep -oP 'workspaces/\K[^/]+')
            FABRIC_GM_ID=$(echo "${FABRIC_ENDPOINT}" | grep -oP 'GraphModels/\K[^/]+')
            echo "fabric_workspace_id=${FABRIC_WS_ID}" >> "$GITHUB_OUTPUT"
            echo "fabric_graphmodel_id=${FABRIC_GM_ID}" >> "$GITHUB_OUTPUT"

            # Find the Lakehouse ID in the workspace
            FABRIC_LH_ID=$(az rest --method get --resource "https://api.fabric.microsoft.com" \
              --url "https://api.fabric.microsoft.com/v1/workspaces/${FABRIC_WS_ID}/items?type=Lakehouse" \
              --query "value[0].id" -o tsv 2>/dev/null || echo "")
            echo "fabric_lakehouse_id=${FABRIC_LH_ID}" >> "$GITHUB_OUTPUT"

            echo "Fabric: ws=${FABRIC_WS_ID}, lh=${FABRIC_LH_ID}, gm=${FABRIC_GM_ID}"
          fi

      - name: Write test data to Valkey
        if: steps.endpoints.outputs.has_fabric == 'true'
        env:
          REDIS_HOST: ${{ steps.endpoints.outputs.redis_host }}
          REDIS_PASSWORD: ${{ steps.endpoints.outputs.redis_password }}
        run: |
          echo "[WRITE] Writing E2E test data to SedanDelivery..."
          redis-cli -h "${REDIS_HOST}" -p 6379 -a "${REDIS_PASSWORD}" --no-auth-warning \
            GQL.MUTATE default "CREATE (:E2ETest {str_val: 'hello', int_val: 42, float_val: 3.14, bool_val: true})"
          redis-cli -h "${REDIS_HOST}" -p 6379 -a "${REDIS_PASSWORD}" --no-auth-warning \
            GQL.MUTATE default "CREATE (:E2ESource {name: 'src'})-[:E2E_LINK {weight: 1.5}]->(:E2ETarget {name: 'tgt'})"
          echo "[WRITE] Test data written"

      - name: Sync to OneLake
        if: steps.endpoints.outputs.has_fabric == 'true' && steps.endpoints.outputs.fabric_lakehouse_id != ''
        env:
          REDIS_HOST: ${{ steps.endpoints.outputs.redis_host }}
          REDIS_PORT: '6379'
          REDIS_PASSWORD: ${{ steps.endpoints.outputs.redis_password }}
          FABRIC_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          FABRIC_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          FABRIC_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          FABRIC_WORKSPACE_ID: ${{ steps.endpoints.outputs.fabric_workspace_id }}
          FABRIC_LAKEHOUSE_ID: ${{ steps.endpoints.outputs.fabric_lakehouse_id }}
          FABRIC_GRAPHMODEL_ID: ${{ steps.endpoints.outputs.fabric_graphmodel_id }}
        run: |
          pip install pyarrow 2>/dev/null || true
          python scripts/sync-to-onelake.py

      - name: Run E2E validation
        if: steps.endpoints.outputs.has_fabric == 'true'
        env:
          REDIS_HOST: ${{ steps.endpoints.outputs.redis_host }}
          REDIS_PORT: '6379'
          REDIS_PASSWORD: ${{ steps.endpoints.outputs.redis_password }}
          BOLT_URI: ${{ steps.endpoints.outputs.bolt_uri }}
          FABRIC_ENDPOINT: ${{ steps.endpoints.outputs.fabric_endpoint }}
          FABRIC_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          FABRIC_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          FABRIC_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          TIMEOUT=${{ inputs.timeout || 120 }}
          python scripts/validate-fabric-e2e.py \
            --timeout "${TIMEOUT}" \
            --report fabric-e2e-report.json

      - name: Skip notice (no Fabric)
        if: steps.endpoints.outputs.has_fabric != 'true'
        run: |
          echo "::notice::Fabric sync is not deployed for this environment — skipping E2E validation"
          echo '{"passed": null, "summary": "Skipped — no Fabric endpoint", "tests": []}' > fabric-e2e-report.json

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: fabric-e2e-report
          path: fabric-e2e-report.json
          retention-days: 30
