name: Neo4j Compatibility Gallery

# Runs on-demand and when Bolt protocol or query engine files change.
# Skips on doc-only or CI-config-only changes.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'sedandelivery-bolt/src/**'
      - 'gql-core/src/executor/**'
      - 'gql-core/src/parser/**'
      - 'gql-core/src/planner/**'
      - 'gql-core/src/storage/**'
      - 'gql-core/src/types/**'
      - 'neo4j-compat-gallery/**'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  compat-test:
    name: Bolt v4.4 Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.1.5

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-compat-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-compat-

      - name: Build Bolt server (release)
        run: cargo build --release -p sedandelivery-bolt

      - name: Install Python neo4j driver
        run: pip install neo4j flask requests

      - name: Run compatibility test suite
        run: python3 neo4j-compat-gallery/test_compatibility.py --start-server
