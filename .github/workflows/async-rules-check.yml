name: Async Rules Check

on:
  pull_request:
    branches: [main, integration]
    paths:
      - 'src/**/*.cs'
      - 'tests/**/*.cs'
      - 'tools/**/*.cs'
      - 'Directory.Build.props'
      - '.github/workflows/async-rules-check.yml'
  push:
    branches: [main, integration]
  workflow_dispatch:

concurrency:
  group: async-rules-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  async-analyzer-check:
    name: Validate Async Patterns
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore CyberGym.sln

      - name: Build with async analyzers
        id: build
        run: |
          echo "Building with async analyzers enabled..."
          dotnet build CyberGym.sln --no-restore --configuration Release -warnaserror 2>&1 | tee build.log
        continue-on-error: true

      - name: Check for async violations
        id: check-violations
        run: |
          echo "Checking for VSTHRD violations..."

          # Extract VSTHRD warnings/errors
          if grep -E "VSTHRD[0-9]{3}" build.log; then
            echo "❌ Async rule violations found:"
            grep -E "VSTHRD[0-9]{3}" build.log | head -20

            # Count violations
            VIOLATION_COUNT=$(grep -c "VSTHRD" build.log || echo "0")
            echo "Total violations: $VIOLATION_COUNT"
            echo "violation_count=$VIOLATION_COUNT" >> $GITHUB_OUTPUT

            exit 1
          else
            echo "✅ No async rule violations found"
            echo "violation_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Run async rules tests
        if: steps.build.outcome == 'success'
        run: |
          dotnet test tests/CyberGym.AsyncRules.Tests/ \
            --no-build \
            --configuration Release \
            --verbosity normal \
            --logger "console;verbosity=detailed"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: async-violations-log
          path: build.log
          retention-days: 7

      - name: Comment PR with violations
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const buildLog = fs.readFileSync('build.log', 'utf8');
            const violations = buildLog.match(/VSTHRD[0-9]{3}[^\n]*/g) || [];

            const uniqueViolations = [...new Set(violations)].slice(0, 10);

            const comment = `## ❌ Async Rule Violations Found

            **Violation Count:** ${violations.length}

            ### Top Violations:
            \`\`\`
            ${uniqueViolations.join('\n')}
            \`\`\`

            ### Common Issues:
            - **VSTHRD200**: Async methods must have \`Async\` suffix
            - **VSTHRD100**: Avoid \`async void\` methods (except event handlers)
            - **VSTHRD002**: Avoid synchronous blocking (\`.Result\`, \`.Wait()\`)
            - **VSTHRD111**: Use \`ConfigureAwait(false)\` in library code
            - **VSTHRD110**: Observe result of async calls (no fire-and-forget)

            ### How to Fix:
            1. Review the violations in the build log artifact
            2. Follow patterns in \`tests/CyberGym.AsyncRules.Tests/AsyncPatternTests.cs\`
            3. See [Async Best Practices](https://github.com/microsoft/vs-threading/blob/main/doc/analyzers/index.md)

            [Download full build log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail if violations found
        if: steps.build.outcome == 'failure'
        run: |
          echo "❌ Build failed due to async rule violations"
          echo "Review the violations above and fix them before merging"
          exit 1

  async-pattern-summary:
    name: Generate Async Pattern Report
    runs-on: ubuntu-latest
    needs: async-analyzer-check
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Analyze async usage
        run: |
          echo "# Async Pattern Analysis Report" > async-report.md
          echo "" >> async-report.md
          echo "## Async Method Count" >> async-report.md
          find src/ -name "*.cs" -exec grep -l "async Task" {} \; | wc -l >> async-report.md
          echo "" >> async-report.md
          echo "## ConfigureAwait Usage" >> async-report.md
          grep -r "ConfigureAwait" src/ --include="*.cs" | wc -l >> async-report.md

      - name: Upload async report
        uses: actions/upload-artifact@v7
        with:
          name: async-pattern-report
          path: async-report.md
          retention-days: 30
