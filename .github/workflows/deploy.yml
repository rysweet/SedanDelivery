name: Deploy SedanDelivery

# Deploys SedanDelivery (Valkey + GQL Redis module) to Azure Container Apps.
#
# Triggers:
#   - PR labeled 'deploy' → isolated branch environment
#   - Push to main → production environment
#   - Manual dispatch → any environment
#
# Mirrors the cybergym deployment pattern.

on:
  pull_request:
    types: [labeled, synchronize]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - production
          - branch
        default: 'branch'
      branch_name:
        description: 'Branch name for branch deployments (leave empty for current branch)'
        required: false
        type: string
      persistenceBackend:
        description: 'Redis backend: valkey | azure-cache | cluster'
        required: false
        default: 'valkey'
      clusterNodeCount:
        description: 'Number of cluster shards (only for cluster mode)'
        required: false
        default: '3'
      replicaCount:
        description: 'Read replicas per shard (0 = no replicas)'
        required: false
        default: '0'

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

env:
  AZURE_LOCATION: eastus2
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ENABLE_FABRIC: 'true'

jobs:
  determine-environment:
    name: Determine Deployment Environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      should-deploy: ${{ steps.check.outputs.should_deploy }}
      env-name: ${{ steps.check.outputs.env_name }}
      env-type: ${{ steps.check.outputs.env_type }}
      resource-group: ${{ steps.check.outputs.resource_group }}
      persistence-backend: ${{ steps.check.outputs.persistence_backend }}
      cluster-node-count: ${{ steps.check.outputs.cluster_node_count }}
      replica-count: ${{ steps.check.outputs.replica_count }}
    steps:
      - name: Determine environment and deployment eligibility
        id: check
        env:
          INPUT_BRANCH_NAME: ${{ inputs.branch_name }}
          GH_HEAD_REF: ${{ github.head_ref }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF: ${{ github.ref }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          GH_HAS_DEPLOY_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'deploy') }}
          GH_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PERSISTENCE_BACKEND: ${{ inputs.persistenceBackend || 'valkey' }}
          INPUT_CLUSTER_NODE_COUNT: ${{ inputs.clusterNodeCount || '3' }}
          INPUT_REPLICA_COUNT: ${{ inputs.replicaCount || '0' }}
        run: |
          set -euo pipefail
          export TZ=UTC  # SR-2: normalize date arithmetic across all runners

          SHOULD_DEPLOY="false"
          ENV_NAME=""
          ENV_TYPE="branch"
          RESOURCE_GROUP=""

          if [[ "${GH_EVENT_NAME}" == "push" && "${GH_REF}" == "refs/heads/main" ]]; then
            SHOULD_DEPLOY="true"
            ENV_NAME="main"
            ENV_TYPE="production"
            RESOURCE_GROUP="rg-sd2-main"
            echo "🚀 Production deployment from main branch"

          elif [[ "${GH_EVENT_NAME}" == "workflow_dispatch" ]]; then
            SHOULD_DEPLOY="true"
            if [[ "${INPUT_ENVIRONMENT}" == "production" ]]; then
              ENV_NAME="main"
              ENV_TYPE="production"
              RESOURCE_GROUP="rg-sd2-main"
            else
              # Use env var instead of direct expression interpolation (shell injection fix)
              BRANCH_NAME="${INPUT_BRANCH_NAME}"
              if [[ -z "$BRANCH_NAME" ]]; then
                BRANCH_NAME="${GH_REF_NAME}"
              fi
               SANITIZED=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9-]/-/g' | tr '[:upper:]' '[:lower:]' | sed 's/--*/-/g' | cut -c1-20 | sed 's/^-*//;s/-*$//')
              if [ -z "$SANITIZED" ]; then
                SANITIZED="manual-deploy"
              fi
              ENV_NAME="${SANITIZED}"
              ENV_TYPE="branch"
              RESOURCE_GROUP="rg-sd2-${SANITIZED}"
            fi
            echo "🎯 Manual deployment to ${ENV_NAME}"

          elif [[ "${GH_EVENT_NAME}" == "pull_request" ]]; then
            if [[ "${GH_HAS_DEPLOY_LABEL}" == "true" ]]; then
              SHOULD_DEPLOY="true"
              # Use env var instead of direct expression interpolation (shell injection fix)
              BRANCH_NAME="${GH_HEAD_REF}"
               SANITIZED=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9-]/-/g' | tr '[:upper:]' '[:lower:]' | sed 's/--*/-/g' | cut -c1-20 | sed 's/^-*//;s/-*$//')
              if [ -z "$SANITIZED" ]; then
                SANITIZED="pr-${GH_PR_NUMBER}"
              fi
              ENV_NAME="${SANITIZED}"
              ENV_TYPE="branch"
              RESOURCE_GROUP="rg-sd2-${SANITIZED}"
              echo "🌿 PR deployment to branch environment: ${ENV_NAME}"
            else
              echo "⏭️ Skipping deployment — no 'deploy' label found"
            fi
          fi

          echo "should_deploy=${SHOULD_DEPLOY}" >> "$GITHUB_OUTPUT"
          echo "env_name=${ENV_NAME}" >> "$GITHUB_OUTPUT"
          echo "env_type=${ENV_TYPE}" >> "$GITHUB_OUTPUT"
          echo "resource_group=${RESOURCE_GROUP}" >> "$GITHUB_OUTPUT"

          # Persistence backend parameters (defaults apply for non-dispatch triggers)
          PERSISTENCE_BACKEND="${INPUT_PERSISTENCE_BACKEND}"
          CLUSTER_NODE_COUNT="${INPUT_CLUSTER_NODE_COUNT}"
          REPLICA_COUNT="${INPUT_REPLICA_COUNT}"

          # Validate persistence backend
          case "${PERSISTENCE_BACKEND}" in
            valkey|azure-cache|cluster) ;;
            *)
              echo "::error::Invalid persistenceBackend '${PERSISTENCE_BACKEND}'. Must be valkey, azure-cache, or cluster."
              exit 1
              ;;
          esac

          echo "persistence_backend=${PERSISTENCE_BACKEND}" >> "$GITHUB_OUTPUT"
          echo "cluster_node_count=${CLUSTER_NODE_COUNT}" >> "$GITHUB_OUTPUT"
          echo "replica_count=${REPLICA_COUNT}" >> "$GITHUB_OUTPUT"

          echo ""
          echo "📦 Deployment Configuration:"
          echo "  Should Deploy: ${SHOULD_DEPLOY}"
          echo "  Environment: ${ENV_NAME}"
          echo "  Resource Group: ${RESOURCE_GROUP}"
          echo "  Persistence Backend: ${PERSISTENCE_BACKEND}"
          echo "  Cluster Node Count: ${CLUSTER_NODE_COUNT}"
          echo "  Replica Count: ${REPLICA_COUNT}"

      - name: Comment on PR when deployment skipped
        if: github.event_name == 'pull_request' && steps.check.outputs.should_deploy == 'false'
        uses: actions/github-script@450193c5abd4cdb17ba9f3ffcfe8f635c4bb6c2a # v7.0.1
        with:
          script: |
            const body = `## ⏭️ Deployment Skipped

            This PR does not have a \`deploy\` label. No deployment was triggered.

            **To deploy this PR to Azure**, add the \`deploy\` label:
            \`\`\`bash
            gh pr edit ${{ github.event.pull_request.number }} --add-label "deploy"
            \`\`\`

            Once labeled, the workflow will run automatically on the next push.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Deployment Skipped')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  deploy:
    name: Deploy to ${{ needs.determine-environment.outputs.env-name }}
    needs: determine-environment
    if: needs.determine-environment.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-environment.outputs.env-name }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    outputs:
      redis-fqdn: ${{ steps.outputs.outputs.redis_fqdn }}
      bolt-fqdn: ${{ steps.outputs.outputs.bolt_fqdn }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.1.5

      - name: Validate workflow Dockerfiles before deploy side effects
        run: |
          bash tests/test_dockerfile_cargo_lock.sh
          bash scripts/validate-dockerfiles.sh

      - name: Azure login
        run: |
          az login \
            --service-principal \
            --username "${{ env.AZURE_CLIENT_ID }}" \
            --password "${{ secrets.AZURE_CLIENT_SECRET }}" \
            --tenant "${{ env.AZURE_TENANT_ID }}" \
            --output none
          az account set --subscription "${{ env.AZURE_SUBSCRIPTION_ID }}"
          echo "✅ Authenticated to Azure"

      - name: Create or update resource group
        run: |
          RG="${{ needs.determine-environment.outputs.resource-group }}"
          ENV_NAME="${{ needs.determine-environment.outputs.env-name }}"

          echo "📦 Ensuring resource group: ${RG}"
          az group create \
            --name "${RG}" \
            --location "${{ env.AZURE_LOCATION }}" \
            --tags "environment=${ENV_NAME}" "managed-by=github-actions" "repo=SedanDelivery" \
            --output none
          echo "✅ Resource group ready: ${RG}"

      - name: Provision ACR + Container Apps Environment
        id: provision
        run: |
          RG="${{ needs.determine-environment.outputs.resource-group }}"
          ENV_NAME="${{ needs.determine-environment.outputs.env-name }}"
          CAE_NAME="sd2-${ENV_NAME}-cae"

          # If CAE exists without a custom VNet, delete it so Bicep can recreate
          # with the VNet configuration (VNet is immutable on existing CAEs).
          EXISTING_SUBNET=$(az containerapp env show \
            --name "${CAE_NAME}" --resource-group "${RG}" \
            --query "properties.vnetConfiguration.infrastructureSubnetId" \
            -o tsv 2>/dev/null || echo "")
          if az containerapp env show --name "${CAE_NAME}" --resource-group "${RG}" >/dev/null 2>&1; then
            if [[ -z "${EXISTING_SUBNET}" || "${EXISTING_SUBNET}" == "None" ]]; then
              echo "⚠️  Existing CAE has no VNet — deleting for VNet migration..."
              # Delete container apps first (required before deleting environment)
              for CA in $(az containerapp list --resource-group "${RG}" --query "[].name" -o tsv 2>/dev/null); do
                echo "   Deleting container app: ${CA}"
                az containerapp delete --name "${CA}" --resource-group "${RG}" --yes --output none 2>/dev/null || true
              done
              az containerapp env delete --name "${CAE_NAME}" --resource-group "${RG}" --yes --output none 2>/dev/null || true
              echo "   Old CAE deleted — Bicep will recreate with VNet"
            fi
          fi

          # Map persistenceBackend to Bicep parameter
          PERSISTENCE_BACKEND="${{ needs.determine-environment.outputs.persistence-backend }}"
          CLUSTER_NODE_COUNT="${{ needs.determine-environment.outputs.cluster-node-count }}"
          REPLICA_COUNT="${{ needs.determine-environment.outputs.replica-count }}"

          # Bicep persistenceBackend mapping:
          #   valkey         -> valkey-volume
          #   azure-cache    -> azure-cache
          #   cluster        -> azure-cache-cluster
          BICEP_BACKEND="valkey-volume"
          case "${PERSISTENCE_BACKEND}" in
            azure-cache) BICEP_BACKEND="azure-cache" ;;
            cluster)     BICEP_BACKEND="azure-cache-cluster" ;;
          esac

          echo "🔧 Provisioning ACR + Container Apps Environment in ${RG}..."
          echo "   Persistence backend: ${PERSISTENCE_BACKEND} (Bicep: ${BICEP_BACKEND})"
          DEPLOYMENT_OUTPUT=$(az deployment group create \
            --resource-group "${RG}" \
            --template-file infra/main.bicep \
            --parameters environmentName="${ENV_NAME}" \
                         persistenceBackend="${BICEP_BACKEND}" \
                         clusterShardCount="${CLUSTER_NODE_COUNT}" \
                         replicasPerShard="${REPLICA_COUNT}" \
                         allowedDatabaseSourceCidr="10.0.0.0/16" \
            --name "sd2-infra-$(date +%s)" \
            --output json)

          ACR_SERVER=$(echo "$DEPLOYMENT_OUTPUT" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['properties']['outputs']['acrLoginServer']['value'])")
          ACR_NAME=$(echo "$DEPLOYMENT_OUTPUT" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['properties']['outputs']['acrName']['value'])")

          CAE_NAME=$(echo "$DEPLOYMENT_OUTPUT" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['properties']['outputs']['caeName']['value'])")

          # Azure Cache resource name only — no secrets in step outputs (Issue #58)
          AZURE_CACHE_NAME=$(echo "$DEPLOYMENT_OUTPUT" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['properties']['outputs']['azureCacheName']['value'])")

          echo "acr_server=${ACR_SERVER}" >> "$GITHUB_OUTPUT"
          echo "acr_name=${ACR_NAME}" >> "$GITHUB_OUTPUT"
          echo "cae_name=${CAE_NAME}" >> "$GITHUB_OUTPUT"
          echo "azure_cache_name=${AZURE_CACHE_NAME}" >> "$GITHUB_OUTPUT"

          echo "✅ Infrastructure provisioned:"
          echo "   ACR: ${ACR_SERVER}"
          echo "   Container Apps Env: ${CAE_NAME}"

      - name: Provision Fabric Graph Database
        id: fabric
        if: env.ENABLE_FABRIC == 'true'
        env:
          FABRIC_ENV_NAME: ${{ needs.determine-environment.outputs.env-name }}
          FABRIC_TENANT: ${{ env.AZURE_TENANT_ID }}
          FABRIC_CLIENT: ${{ env.AZURE_CLIENT_ID }}
          FABRIC_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          # Run fabric provisioning — tee stdout so it appears in logs AND is captured
          set +e  # Don't fail the step if provisioning fails
          FABRIC_OUTPUT=$(scripts/provision-fabric.sh \
            "${FABRIC_ENV_NAME}" \
            "${FABRIC_TENANT}" \
            "${FABRIC_CLIENT}" \
            "${FABRIC_SECRET}" 2>&1 | tee /dev/stderr)
          FABRIC_RC=$?
          set -euo pipefail  # Restore strict mode after intentional set +e

          if [[ $FABRIC_RC -ne 0 ]]; then
            echo "::warning::Fabric provisioning failed (exit code ${FABRIC_RC})"
            echo "has_fabric=false" >> "$GITHUB_OUTPUT"
          else
            FABRIC_ENDPOINT=$(echo "$FABRIC_OUTPUT" | grep "^FABRIC_ENDPOINT=" | cut -d= -f2-)
            FABRIC_WORKSPACE_ID=$(echo "$FABRIC_OUTPUT" | grep "^FABRIC_WORKSPACE_ID=" | cut -d= -f2-)
            FABRIC_LAKEHOUSE_ID=$(echo "$FABRIC_OUTPUT" | grep "^FABRIC_LAKEHOUSE_ID=" | cut -d= -f2-)
            FABRIC_GDB_ID=$(echo "$FABRIC_OUTPUT" | grep "^FABRIC_GDB_ID=" | cut -d= -f2-)
            if [[ -n "$FABRIC_ENDPOINT" ]]; then
              echo "::add-mask::${FABRIC_ENDPOINT}"
              echo "fabric_endpoint=${FABRIC_ENDPOINT}" >> "$GITHUB_OUTPUT"
              echo "fabric_workspace_id=${FABRIC_WORKSPACE_ID}" >> "$GITHUB_OUTPUT"
              echo "fabric_lakehouse_id=${FABRIC_LAKEHOUSE_ID}" >> "$GITHUB_OUTPUT"
              echo "fabric_gdb_id=${FABRIC_GDB_ID}" >> "$GITHUB_OUTPUT"
              echo "has_fabric=true" >> "$GITHUB_OUTPUT"
              echo "Fabric provisioned: has_fabric=true (lakehouse=${FABRIC_LAKEHOUSE_ID})"
            else
              echo "::warning::Fabric provisioning succeeded but FABRIC_ENDPOINT was empty"
              echo "Script output: ${FABRIC_OUTPUT}"
              echo "has_fabric=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Build and push Docker image via ACR Tasks
        id: build
        env:
          GH_SHA: ${{ github.sha }}
        run: |
          ACR_NAME="${{ steps.provision.outputs.acr_name }}"
          ACR_SERVER="${{ steps.provision.outputs.acr_server }}"
          IMAGE_TAG="${GH_SHA}"

          echo "🐳 Building sedan-delivery (Valkey+GQL module) via ACR Tasks..."
          echo "   ACR: ${ACR_NAME}"
          echo "   Tag: ${IMAGE_TAG}"

          az acr build \
            --registry "${ACR_NAME}" \
            --image "sedan-delivery:${IMAGE_TAG}" \
            --image "sedan-delivery:latest" \
            --file Dockerfile \
            --platform linux/amd64 \
            .

          echo "✅ Image built and pushed: ${ACR_SERVER}/sedan-delivery:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push sedandelivery-fabric-sync image via ACR Tasks
        id: build-sync
        if: env.ENABLE_FABRIC == 'true'
        env:
          GH_SHA: ${{ github.sha }}
        run: |
          ACR_NAME="${{ steps.provision.outputs.acr_name }}"
          ACR_SERVER="${{ steps.provision.outputs.acr_server }}"
          IMAGE_TAG="${GH_SHA}"

          echo "🐳 Building sedandelivery-fabric-sync (Fabric sync sidecar) via ACR Tasks..."

          az acr build \
            --registry "${ACR_NAME}" \
            --image "sedandelivery-fabric-sync:${IMAGE_TAG}" \
            --image "sedandelivery-fabric-sync:latest" \
            --file Dockerfile.sync \
            --platform linux/amd64 \
            .

          echo "✅ sedandelivery-fabric-sync image pushed: ${ACR_SERVER}/sedandelivery-fabric-sync:${IMAGE_TAG}"
          echo "sync_image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push sedandelivery-bolt image via ACR Tasks
        id: build-bolt
        env:
          GH_SHA: ${{ github.sha }}
        run: |
          ACR_NAME="${{ steps.provision.outputs.acr_name }}"
          ACR_SERVER="${{ steps.provision.outputs.acr_server }}"
          IMAGE_TAG="${GH_SHA}"

          echo "🐳 Building sedandelivery-bolt (standalone Bolt server) via ACR Tasks..."

          az acr build \
            --registry "${ACR_NAME}" \
            --image "sedandelivery-bolt:${IMAGE_TAG}" \
            --image "sedandelivery-bolt:latest" \
            --file Dockerfile.bolt \
            --platform linux/amd64 \
            .

          echo "✅ sedandelivery-bolt image pushed: ${ACR_SERVER}/sedandelivery-bolt:${IMAGE_TAG}"
          echo "bolt_image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push sd2-api image via ACR Tasks
        id: build-api
        env:
          GH_SHA: ${{ github.sha }}
        run: |
          ACR_NAME="${{ steps.provision.outputs.acr_name }}"
          ACR_SERVER="${{ steps.provision.outputs.acr_server }}"
          IMAGE_TAG="${GH_SHA}"

          echo "🐳 Building sd2-api (REST API server) via ACR Tasks..."

          az acr build \
            --registry "${ACR_NAME}" \
            --image "sd2-api:${IMAGE_TAG}" \
            --image "sd2-api:latest" \
            --file Dockerfile.api \
            --platform linux/amd64 \
            .

          echo "✅ sd2-api image pushed: ${ACR_SERVER}/sd2-api:${IMAGE_TAG}"
          echo "api_image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Provision Entra ID API scope (idempotent)
        id: provision-entra-api
        env:
          ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID || '97926b31-e1a3-4a76-b09d-eed5aeeabc9f' }}
        run: |
          ENTRA_OUTPUT=$(scripts/provision-entra-api.sh "${ENTRA_CLIENT_ID}" 2>&1 | tee /dev/stderr)
          TENANT_ID=$(echo "$ENTRA_OUTPUT" | grep "^GQL_API_ENTRA_TENANT_ID=" | cut -d= -f2-)
          CLIENT_ID=$(echo "$ENTRA_OUTPUT" | grep "^GQL_API_ENTRA_CLIENT_ID=" | cut -d= -f2-)
          echo "entra_tenant_id=${TENANT_ID}" >> "$GITHUB_OUTPUT"
          echo "entra_client_id=${CLIENT_ID}" >> "$GITHUB_OUTPUT"

      - name: Create or update Container App
        id: deploy-app
        env:
          DEPLOY_RG: ${{ needs.determine-environment.outputs.resource-group }}
          DEPLOY_ENV_NAME: ${{ needs.determine-environment.outputs.env-name }}
          DEPLOY_CAE_NAME: ${{ steps.provision.outputs.cae_name }}
          DEPLOY_ACR_NAME: ${{ steps.provision.outputs.acr_name }}
          DEPLOY_ACR_SERVER: ${{ steps.provision.outputs.acr_server }}
          DEPLOY_IMAGE_TAG: ${{ steps.build.outputs.image_tag }}
          DEPLOY_AZURE_CACHE_NAME: ${{ steps.provision.outputs.azure_cache_name }}
          DEPLOY_HAS_FABRIC: ${{ steps.fabric.outputs.has_fabric }}
          DEPLOY_FABRIC_ENDPOINT: ${{ steps.fabric.outputs.fabric_endpoint }}
          DEPLOY_AZURE_TENANT_ID: ${{ env.AZURE_TENANT_ID }}
          DEPLOY_AZURE_CLIENT_ID: ${{ env.AZURE_CLIENT_ID }}
          DEPLOY_AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          RG="${DEPLOY_RG}"
          ENV_NAME="${DEPLOY_ENV_NAME}"
          CAE_NAME="${DEPLOY_CAE_NAME}"
          ACR_NAME="${DEPLOY_ACR_NAME}"
          ACR_SERVER="${DEPLOY_ACR_SERVER}"
          IMAGE_TAG="${DEPLOY_IMAGE_TAG}"
          IMAGE="${ACR_SERVER}/sedan-delivery:${IMAGE_TAG}"
          CA_NAME="sd2-${ENV_NAME}-redis"

          # Retrieve Azure Cache connection string at deploy time (Issue #58)
          # Keys are fetched via `az redis` — never stored in ARM outputs or step outputs
          PERSISTENCE_BACKEND="${{ needs.determine-environment.outputs.persistence-backend }}"
          AZURE_CACHE_CONN=""
          AZURE_CACHE_CLUSTER_NODES=""
          if [[ -n "${DEPLOY_AZURE_CACHE_NAME}" && "${DEPLOY_AZURE_CACHE_NAME}" != "" ]]; then
            AZURE_CACHE_HOST=$(az redis show --name "${DEPLOY_AZURE_CACHE_NAME}" --resource-group "${RG}" --query hostName -o tsv)
            AZURE_CACHE_PORT=$(az redis show --name "${DEPLOY_AZURE_CACHE_NAME}" --resource-group "${RG}" --query sslPort -o tsv)
            REDIS_KEY=$(az redis list-keys --name "${DEPLOY_AZURE_CACHE_NAME}" --resource-group "${RG}" --query primaryKey -o tsv)
            if [[ -z "$REDIS_KEY" ]]; then
              echo "::error::Failed to retrieve Redis primary key — aborting"
              exit 1
            fi
            echo "::add-mask::${REDIS_KEY}"

            if [[ "${PERSISTENCE_BACKEND}" == "cluster" ]]; then
              # Cluster mode: set cluster nodes env var (Azure Cache cluster uses same host)
              AZURE_CACHE_CLUSTER_NODES="rediss://:${REDIS_KEY}@${AZURE_CACHE_HOST}:${AZURE_CACHE_PORT}"
              echo "::add-mask::${AZURE_CACHE_CLUSTER_NODES}"
            else
              AZURE_CACHE_CONN="${AZURE_CACHE_HOST}:${AZURE_CACHE_PORT},password=${REDIS_KEY},ssl=True,abortConnect=False"
              echo "::add-mask::${AZURE_CACHE_CONN}"
            fi
          fi

          # ACR admin credentials removed — using managed identity auth (Issue #67)

          echo "🚀 Deploying Container App: ${CA_NAME}"
          echo "   Image: ${IMAGE}"

          # Volume args — disable persistent storage for now (demo uses ephemeral /data).
          # To enable Azure Files persistence, use `az containerapp storage set` separately
          # and then `az containerapp update` with the --yaml mount specification.
          VOLUME_ARGS=""

          # Reuse existing Valkey password on updates to avoid credential churn (Issue #59)
          VALKEY_PASS=""
          if az containerapp show --name "${CA_NAME}" --resource-group "${RG}" >/dev/null 2>&1; then
            VALKEY_PASS=$(az containerapp secret show --name "${CA_NAME}" --resource-group "${RG}" --secret-name valkey-password --query value -o tsv 2>/dev/null || true)
          fi
          if [[ -z "${VALKEY_PASS}" ]]; then
            VALKEY_PASS=$(openssl rand -base64 32 | tr -d '/+=\n')
          fi
          echo "::add-mask::${VALKEY_PASS}"  # mask before any subsequent use

          # Build secrets and env-var args
          SECRETS_ARGS="valkey-password=${VALKEY_PASS}"
          ENV_VAR_ARGS="GQL_DATA_DIR=/data VALKEY_PASSWORD=secretref:valkey-password"
          if [[ -n "${AZURE_CACHE_CLUSTER_NODES}" ]]; then
            # Cluster mode: set GQL_REDIS_CLUSTER_NODES instead of GQL_REDIS_URL
            SECRETS_ARGS="${SECRETS_ARGS} redis-cluster-nodes=${AZURE_CACHE_CLUSTER_NODES}"
            ENV_VAR_ARGS="${ENV_VAR_ARGS} GQL_REDIS_CLUSTER_NODES=secretref:redis-cluster-nodes"
          elif [[ -n "${AZURE_CACHE_CONN}" ]]; then
            SECRETS_ARGS="${SECRETS_ARGS} redis-conn=${AZURE_CACHE_CONN}"
            ENV_VAR_ARGS="${ENV_VAR_ARGS} GQL_REDIS_URL=secretref:redis-conn"
          fi

          # Fabric Graph Database env vars (opt-in via ENABLE_FABRIC).
          # GQL_FABRIC_CHANGELOG=1 tells sd2-redis-module to write to __sd2:changelog;
          # the Fabric credentials are only needed by sedandelivery-fabric-sync sidecar.
          if [[ "${DEPLOY_HAS_FABRIC}" == "true" ]]; then
            ENV_VAR_ARGS="${ENV_VAR_ARGS} GQL_FABRIC_CHANGELOG=1"
          fi

          # Helper: create container app from scratch (used for new deploys and recovery)
          create_container_app() {
            echo "🆕 Creating container app ${CA_NAME}..."
            ACR_ACCESS_TOKEN=$(az acr login --name "${ACR_NAME}" --expose-token --query accessToken -o tsv)
            if [[ -z "${ACR_ACCESS_TOKEN}" ]]; then
              echo "::error::Failed to obtain ACR access token for ${ACR_NAME}"
              exit 1
            fi
            echo "::add-mask::${ACR_ACCESS_TOKEN}"
            az containerapp create \
              --name "${CA_NAME}" \
              --resource-group "${RG}" \
              --environment "${CAE_NAME}" \
              --image "${IMAGE}" \
              --registry-server "${ACR_SERVER}" \
              --registry-username "00000000-0000-0000-0000-000000000000" \
              --registry-password "${ACR_ACCESS_TOKEN}" \
              --system-assigned \
              --cpu 0.5 \
              --memory 1Gi \
              --min-replicas 1 \
              --max-replicas 1 \
              --ingress external \
              --target-port 6379 \
              --transport tcp \
              --secrets ${SECRETS_ARGS} \
              --env-vars ${ENV_VAR_ARGS} \
              ${VOLUME_ARGS} \
              --output none
          }

          ensure_registry_identity_auth() {
            CA_PRINCIPAL_ID=$(az containerapp show \
              --name "${CA_NAME}" \
              --resource-group "${RG}" \
              --query "identity.principalId" \
              -o tsv 2>/dev/null || echo "")
            if [[ -z "${CA_PRINCIPAL_ID}" || "${CA_PRINCIPAL_ID}" == "None" ]]; then
              echo "::error::Container App managed identity is not available for ${CA_NAME}"
              exit 1
            fi
            ACR_RESOURCE_ID=$(az acr show --name "${ACR_NAME}" --query id -o tsv)
            ROLE_ASSIGNMENT_OUTPUT=""
            if ! ROLE_ASSIGNMENT_OUTPUT=$(az role assignment create \
              --assignee-object-id "${CA_PRINCIPAL_ID}" \
              --assignee-principal-type ServicePrincipal \
              --role "AcrPull" \
              --scope "${ACR_RESOURCE_ID}" \
              --output none 2>&1); then
              if [[ "${ROLE_ASSIGNMENT_OUTPUT}" != *"RoleAssignmentExists"* && \
                    "${ROLE_ASSIGNMENT_OUTPUT}" != *"role assignment already exists"* && \
                    "${ROLE_ASSIGNMENT_OUTPUT}" != *"The role assignment already exists"* ]]; then
                echo "::error::Failed to assign AcrPull role to ${CA_PRINCIPAL_ID}: ${ROLE_ASSIGNMENT_OUTPUT}"
                exit 1
              fi
              echo "   AcrPull role assignment already exists for ${CA_PRINCIPAL_ID}"
            fi
            ACR_PULL_VISIBLE=false
            for attempt in $(seq 1 12); do
              ASSIGNMENT_ERROR_FILE="$(mktemp)"
              if ! ASSIGNMENT_COUNT=$(az role assignment list \
                --assignee-object-id "${CA_PRINCIPAL_ID}" \
                --scope "${ACR_RESOURCE_ID}" \
                --query "[?roleDefinitionName=='AcrPull'] | length(@)" \
                -o tsv 2>"${ASSIGNMENT_ERROR_FILE}"); then
                ASSIGNMENT_ERROR="$(cat "${ASSIGNMENT_ERROR_FILE}")"
                rm -f "${ASSIGNMENT_ERROR_FILE}"
                echo "::error::Failed to verify AcrPull role assignment for ${CA_PRINCIPAL_ID}: ${ASSIGNMENT_ERROR}"
                exit 1
              fi
              rm -f "${ASSIGNMENT_ERROR_FILE}"
              if [[ "${ASSIGNMENT_COUNT}" =~ ^[1-9][0-9]*$ ]]; then
                ACR_PULL_VISIBLE=true
                break
              fi
              echo "   Waiting for AcrPull role assignment to propagate (attempt ${attempt}/12)..."
              sleep 10
            done
            if [[ "${ACR_PULL_VISIBLE}" != "true" ]]; then
              echo "::error::AcrPull role assignment for ${CA_PRINCIPAL_ID} was not visible before switching registry auth"
              exit 1
            fi
            az containerapp registry set \
              --name "${CA_NAME}" \
              --resource-group "${RG}" \
              --server "${ACR_SERVER}" \
              --identity system \
              --output none
            echo "   AcrPull role assigned to ${CA_PRINCIPAL_ID}"
          }

          # Check if container app already exists
          if az containerapp show --name "${CA_NAME}" --resource-group "${RG}" >/dev/null 2>&1; then
            echo "🔄 Updating existing container app (Issue #68)..."
            # Try update; if it fails (broken revision, registry auth issues),
            # delete and recreate for idempotent recovery.
            UPDATE_OK=true
            ensure_registry_identity_auth
            az containerapp secret set \
              --name "${CA_NAME}" \
              --resource-group "${RG}" \
              --secrets ${SECRETS_ARGS} \
              --output none 2>/dev/null || true
            az containerapp update \
              --name "${CA_NAME}" \
              --resource-group "${RG}" \
              --image "${IMAGE}" \
              --set-env-vars ${ENV_VAR_ARGS} \
              --output none 2>&1 || UPDATE_OK=false

            if [[ "${UPDATE_OK}" == "false" ]]; then
              echo "⚠️  Update failed — deleting and recreating for recovery..."
              az containerapp delete --name "${CA_NAME}" --resource-group "${RG}" --yes --output none 2>/dev/null || true
              create_container_app
              ensure_registry_identity_auth
            fi
          else
            create_container_app
            ensure_registry_identity_auth
          fi

          echo "ca_name=${CA_NAME}" >> "$GITHUB_OUTPUT"
          echo "✅ Container App deployed: ${CA_NAME}"

      - name: Wait for Container App to be running
        run: |
          RG="${{ needs.determine-environment.outputs.resource-group }}"
          CA_NAME="${{ steps.deploy-app.outputs.ca_name }}"

          echo "⏳ Waiting for container app to reach Running state..."
          timeout_s=120
          poll_interval_s=5
          max_iters=$((timeout_s / poll_interval_s))
          iter=0
          while [[ $iter -lt $max_iters ]]; do
            RUNNING=$(timeout 10s az containerapp show \
              --name "${CA_NAME}" \
              --resource-group "${RG}" \
              --query "properties.runningStatus" \
              --output tsv 2>/dev/null || echo "Unknown")
            if [[ "$RUNNING" == "Running" ]]; then
              echo "✅ Container app is running (after $((iter * poll_interval_s))s)"
              break
            fi
            iter=$((iter + 1))
            if [[ $iter -ge $max_iters ]]; then
              echo "⚠️  Timeout after ${timeout_s}s — check logs in Azure portal"
              break
            fi
            sleep "${poll_interval_s}"
          done

      - name: Remove Bolt port 7687 from Valkey container (bolt is now separate)
        run: |
          RG="${{ needs.determine-environment.outputs.resource-group }}"
          CA_NAME="${{ steps.deploy-app.outputs.ca_name }}"
          SUB_ID="${{ env.AZURE_SUBSCRIPTION_ID }}"

          echo "🔌 Removing Bolt port 7687 from Valkey container (now handled by bolt Container App)..."
          # Clear additionalPortMappings so port 7687 is free for the bolt container.
          # Use empty array — this is idempotent (safe if already empty).
          az rest --method PATCH \
            --url "https://management.azure.com/subscriptions/${SUB_ID}/resourceGroups/${RG}/providers/Microsoft.App/containerApps/${CA_NAME}?api-version=2024-03-01" \
            --body '{"properties":{"configuration":{"ingress":{"additionalPortMappings":[]}}}}' \
            --output none
          echo "✅ Bolt port 7687 freed for standalone bolt Container App"

      - name: Deploy sedandelivery-bolt standalone Container App
        id: deploy-bolt
        env:
          DEPLOY_RG: ${{ needs.determine-environment.outputs.resource-group }}
          DEPLOY_ENV_NAME: ${{ needs.determine-environment.outputs.env-name }}
          DEPLOY_CAE_NAME: ${{ steps.provision.outputs.cae_name }}
          DEPLOY_ACR_SERVER: ${{ steps.provision.outputs.acr_server }}
          DEPLOY_ACR_NAME: ${{ steps.provision.outputs.acr_name }}
          DEPLOY_BOLT_IMAGE_TAG: ${{ steps.build-bolt.outputs.bolt_image_tag }}
          DEPLOY_AZURE_CACHE_NAME: ${{ steps.provision.outputs.azure_cache_name }}
          DEPLOY_PERSISTENCE_BACKEND: ${{ needs.determine-environment.outputs.persistence-backend }}
          DEPLOY_REPLICA_COUNT: ${{ needs.determine-environment.outputs.replica-count }}
          DEPLOY_BOLT_TLS_CERT_PEM: ${{ secrets.DEPLOY_BOLT_TLS_CERT_PEM }}
          DEPLOY_BOLT_TLS_KEY_PEM: ${{ secrets.DEPLOY_BOLT_TLS_KEY_PEM }}
          # SEC-09: hardcoded to string '0'; must NOT be overridable via workflow_dispatch or matrix vars.
          # Default 0 means only truly expired certs are rejected (not certs expiring soon).
          BOLT_TLS_CERT_LOOKAHEAD_SECONDS: "0"
        run: |
          RG="${DEPLOY_RG}"
          ENV_NAME="${DEPLOY_ENV_NAME}"
          CAE_NAME="${DEPLOY_CAE_NAME}"
          ACR_SERVER="${DEPLOY_ACR_SERVER}"
          ACR_NAME="${DEPLOY_ACR_NAME}"
          IMAGE="${ACR_SERVER}/sedandelivery-bolt:${DEPLOY_BOLT_IMAGE_TAG}"
          CA_NAME="sd2-${ENV_NAME}-bolt"
          PERSISTENCE_BACKEND="${DEPLOY_PERSISTENCE_BACKEND}"
          REPLICA_COUNT="${DEPLOY_REPLICA_COUNT}"
          BOLT_SECRET_MOUNT_PATH="/mnt/secrets"
          BOLT_TLS_CERT_PATH="${BOLT_SECRET_MOUNT_PATH}/bolt-tls-cert"
          BOLT_TLS_KEY_PATH="${BOLT_SECRET_MOUNT_PATH}/bolt-tls-key"

          set -euo pipefail
          export TZ=UTC

          # ---------------------------------------------------------------------------
          # cert_pem_is_current — Validate a PEM certificate is currently valid.
          #
          # Usage: cert_pem_is_current <pem_string> <lookahead_seconds>
          #
          # Returns 0 if the cert is valid and not expiring within lookahead_seconds.
          # Returns 1 (fail closed) on: missing cert, expired cert, invalid lookahead,
          # lookahead > 604800, or cert not-before date in the future.
          #
          # Security controls implemented:
          #   S-VAL-1: return 1 on empty PEM
          #   S-VAL-2: anchored ^[0-9]+$ guard for lookahead
          #   S-VAL-3: upper-bound 604800 check
          #   S-DATA-1: no echo/cat/printf of PEM or key content
          #   S-DATA-2: mktemp + trap EXIT ERR for temp files
          #   S-AUTH-1: accepts PEM string directly (no raw user-supplied file path)
          #   SR-2: export TZ=UTC before date arithmetic
          # ---------------------------------------------------------------------------
          cert_pem_is_current() {
            local pem_string="$1" lookahead_seconds="${2:-0}"
            # Guards: empty PEM, non-integer lookahead, lookahead > 604800 all return 1.
            # Uses openssl x509 -checkend for expiry; openssl x509 -startdate for not-before.
            [[ -z "${pem_string}" ]] && return 1
            # Integer guard: ^[0-9]+$ rejects invalid (non-integer) lookahead values
            if [[ ! "${lookahead_seconds}" =~ ^[0-9]+$ ]]; then
              echo "::error::BOLT_TLS_CERT_LOOKAHEAD_SECONDS is not a valid non-negative integer" >&2
              return 1
            fi
            [[ "${lookahead_seconds}" -gt 604800 ]] && return 1
            # S-AUTH-1: validate PEM via process substitution (no user-supplied file path)
            if ! openssl x509 -noout -in <(printf '%b\n' "${pem_string}") 2>/dev/null; then
              return 1
            fi
            # S-DATA-2: mktemp + trap ERR for startdate check (TZ=UTC already exported)
            local _cert_tmp=""
            _cert_tmp="$(mktemp)" || return 1
            trap 'rm -f "${_cert_tmp:-}"' ERR
            printf '%b\n' "${pem_string}" > "${_cert_tmp}"
            # Check not-before: cert must already be valid (not future-dated)
            local not_before_str not_before_epoch now_epoch
            not_before_str="$(openssl x509 -in "${_cert_tmp}" -noout -startdate 2>/dev/null | cut -d= -f2)"
            if [[ -z "${not_before_str}" ]]; then rm -f "${_cert_tmp}"; trap - ERR; return 1; fi
            not_before_epoch="$(date -d "${not_before_str}" +%s 2>/dev/null || true)"
            now_epoch="$(date +%s)"
            if [[ -z "${not_before_epoch}" ]] || [[ "${not_before_epoch}" -gt "${now_epoch}" ]]; then
              rm -f "${_cert_tmp}"; trap - ERR; return 1
            fi
            # checkend: reject if cert expires within lookahead window
            if ! openssl x509 -in "${_cert_tmp}" -noout -checkend "${lookahead_seconds}" 2>/dev/null; then
              rm -f "${_cert_tmp}"; trap - ERR; return 1
            fi
            rm -f "${_cert_tmp}"; trap - ERR; return 0
          }

          mask_multiline_secret() {
            local value="$1"
            local escaped="${value//'%'/'%25'}"
            escaped="${escaped//$'\r'/'%0D'}"
            escaped="${escaped//$'\n'/'%0A'}"
            echo "::add-mask::${escaped}"
          }

          # ---------------------------------------------------------------------------
          # SEC-09 integer guard for the cert lookahead value (S-VAL-1/2/3).
          # ---------------------------------------------------------------------------
          validate_lookahead_guard() {
            [[ -z "${BOLT_TLS_CERT_LOOKAHEAD_SECONDS}" ]] && return 1  # S-VAL-1: empty rejected
            # S-VAL-2: anchored integer guard — anchored regex ^[0-9]+$ rejects non-integers
            # (validates that the cert-lookahead value is a non-negative decimal integer)
            # S-VAL-2 check:
            if [[ ! "${BOLT_TLS_CERT_LOOKAHEAD_SECONDS}" =~ ^[0-9]+$ ]]; then return 1; fi
            # S-VAL-3: upper bound — reject values exceeding 604800 (7 days)
            if [[ "${BOLT_TLS_CERT_LOOKAHEAD_SECONDS}" -gt 604800 ]]; then
              echo "::error::Cert lookahead exceeds 604800 upper bound (S-VAL-3)" >&2
              return 1
            fi
          }
          validate_lookahead_guard || exit 1

          # ---------------------------------------------------------------------------
          # Bolt server deployment begins below.
          # ---------------------------------------------------------------------------
          # Prerequisites verified above:
          #   - cert-lookahead value validated as a non-negative integer <= 604800
          #   - SEC-09 compliance confirmed (value hardcoded to "0" per policy)
          # ---------------------------------------------------------------------------
          # Step 1: Resolve Redis backend URL
          #   If DEPLOY_AZURE_CACHE_NAME is set, use Azure Cache for Redis (rediss://).
          #   Otherwise fall back to the local Valkey container (redis://).
          #   REDIS_URL, CLUSTER_NODES, REPLICA_URL are set accordingly.
          # ---------------------------------------------------------------------------
          # Step 2: Validate TLS certificate (cert_pem_is_current)
          #   Applied only when DEPLOY_BOLT_TLS_CERT_PEM and DEPLOY_BOLT_TLS_KEY_PEM
          #   are both set. Port 7687 is used for TLS, port 7688 without TLS.
          # ---------------------------------------------------------------------------
          # Step 3: Deploy the Bolt container app
          #   Uses: CA_NAME, ENV_NAME, RG, PERSISTENCE_BACKEND,
          #         REDIS_URL or CLUSTER_NODES (from step 1),
          #         TLS secrets (from step 2, if applicable)
          # ---------------------------------------------------------------------------
          # Step 4: Configure ingress (ACA internal TCP, port 7687 or 7688)
          #   and autoscaling (min=1 replicas, max=BOLT_MAX_REPLICAS)
          # ---------------------------------------------------------------------------
          #

          echo "🚀 Deploying standalone Bolt server: ${CA_NAME}"
          echo "   Persistence backend: ${PERSISTENCE_BACKEND}"

          # Determine Redis backend URL for the bolt server.
          # Priority: Azure Cache (if provisioned) > local Valkey container.
          REDIS_URL=""
          CLUSTER_NODES=""
          REPLICA_URL=""
          if [[ -n "${DEPLOY_AZURE_CACHE_NAME}" && "${DEPLOY_AZURE_CACHE_NAME}" != "" ]]; then
            # Azure Cache for Redis — use TLS connection (rediss://)
            AZURE_CACHE_HOST=$(az redis show --name "${DEPLOY_AZURE_CACHE_NAME}" --resource-group "${RG}" --query hostName -o tsv)
            AZURE_CACHE_PORT=$(az redis show --name "${DEPLOY_AZURE_CACHE_NAME}" --resource-group "${RG}" --query sslPort -o tsv)
            REDIS_KEY=$(az redis list-keys --name "${DEPLOY_AZURE_CACHE_NAME}" --resource-group "${RG}" --query primaryKey -o tsv)
            if [[ -n "$REDIS_KEY" ]]; then
              echo "::add-mask::${REDIS_KEY}"
              if [[ "${PERSISTENCE_BACKEND}" == "cluster" ]]; then
                CLUSTER_NODES="rediss://:${REDIS_KEY}@${AZURE_CACHE_HOST}:${AZURE_CACHE_PORT}"
              else
                REDIS_URL="rediss://:${REDIS_KEY}@${AZURE_CACHE_HOST}:${AZURE_CACHE_PORT}"
              fi

              # When replicas are configured, set GQL_REDIS_REPLICA_URL.
              # Azure Cache Standard/Premium includes built-in read replicas accessible
              # via the same host — the client library handles read routing.
              if [[ "${REPLICA_COUNT}" -gt 0 ]]; then
                REPLICA_URL="rediss://:${REDIS_KEY}@${AZURE_CACHE_HOST}:${AZURE_CACHE_PORT}"
              fi
            fi
          fi
          if [[ -z "${REDIS_URL}" && -z "${CLUSTER_NODES}" ]]; then
            # Fall back to local Valkey container
            REDIS_CA_NAME="sd2-${ENV_NAME}-redis"
            VALKEY_PASS=$(az containerapp secret show \
              --name "${REDIS_CA_NAME}" --resource-group "${RG}" \
              --secret-name valkey-password --query value -o tsv 2>/dev/null || echo "")
            if [[ -n "${VALKEY_PASS}" ]]; then
              echo "::add-mask::${VALKEY_PASS}"
              REDIS_URL="redis://:${VALKEY_PASS}@${REDIS_CA_NAME}:6379"
            else
              REDIS_URL="redis://${REDIS_CA_NAME}:6379"
            fi
          fi
          [[ -n "${REDIS_URL}" ]] && echo "::add-mask::${REDIS_URL}"
          [[ -n "${CLUSTER_NODES}" ]] && echo "::add-mask::${CLUSTER_NODES}"
          [[ -n "${REPLICA_URL}" ]] && echo "::add-mask::${REPLICA_URL}"

          # TLS is required for all Bolt deploy environments.
          # DEPLOY_BOLT_TLS_CERT_PEM and DEPLOY_BOLT_TLS_KEY_PEM must be
          # explicitly set. If either is absent or the certificate is expired,
          # this step exits non-zero with an actionable error. No self-signed
          # fallback or self-healing is performed.
          BOLT_TLS_ENABLED=false
          if [[ -n "${DEPLOY_BOLT_TLS_CERT_PEM}" && -n "${DEPLOY_BOLT_TLS_KEY_PEM}" ]]; then
            mask_multiline_secret "${DEPLOY_BOLT_TLS_CERT_PEM}"
            mask_multiline_secret "${DEPLOY_BOLT_TLS_KEY_PEM}"
            if ! cert_pem_is_current "${DEPLOY_BOLT_TLS_CERT_PEM}" "${BOLT_TLS_CERT_LOOKAHEAD_SECONDS:-0}"; then
              echo "::error::DEPLOY_BOLT_TLS_CERT_PEM is expired or not yet valid; provision a current certificate before deploying"
              exit 1
            fi
            BOLT_TLS_ENABLED=true
            echo "   TLS cert validated: currently valid, not expired within ${BOLT_TLS_CERT_LOOKAHEAD_SECONDS:-0}s lookahead"
          else
            echo "::error::DEPLOY_BOLT_TLS_CERT_PEM and DEPLOY_BOLT_TLS_KEY_PEM must both be set; provision TLS secrets before deploying"
            exit 1
          fi

          # Reuse the existing Bolt password on updates to avoid credential churn.
          APP_EXISTS=false
          BOLT_PASS=""
          if az containerapp show --name "${CA_NAME}" --resource-group "${RG}" >/dev/null 2>&1; then
            APP_EXISTS=true
            if ! EXISTING_BOLT_SECRET_NAMES=$(az containerapp show \
              --name "${CA_NAME}" \
              --resource-group "${RG}" \
              --query "properties.configuration.secrets[].name" \
              -o tsv 2>&1); then
              echo "::error::Failed to inspect existing Bolt secrets for ${CA_NAME}: ${EXISTING_BOLT_SECRET_NAMES}"
              exit 1
            fi
            if printf '%s\n' "${EXISTING_BOLT_SECRET_NAMES}" | grep -Fxq "bolt-password"; then
              BOLT_PASS_VALUE_FILE="$(mktemp)"
              BOLT_PASS_ERROR_FILE="$(mktemp)"
              if ! az containerapp secret show \
                --name "${CA_NAME}" \
                --resource-group "${RG}" \
                --secret-name bolt-password \
                --query value \
                -o tsv >"${BOLT_PASS_VALUE_FILE}" 2>"${BOLT_PASS_ERROR_FILE}"; then
                BOLT_PASS_ERROR="$(cat "${BOLT_PASS_ERROR_FILE}")"
                rm -f "${BOLT_PASS_VALUE_FILE}" "${BOLT_PASS_ERROR_FILE}"
                echo "::error::Existing Bolt app has bolt-password configured but secret lookup failed: ${BOLT_PASS_ERROR}"
                exit 1
              fi
              BOLT_PASS="$(tr -d '\r' < "${BOLT_PASS_VALUE_FILE}")"
              rm -f "${BOLT_PASS_VALUE_FILE}" "${BOLT_PASS_ERROR_FILE}"
              if [[ -z "${BOLT_PASS}" ]]; then
                echo "::error::Existing Bolt app has bolt-password configured but secret lookup failed — refusing to rotate credentials"
                exit 1
              fi
            else
              echo "::warning::Existing Bolt app has no bolt-password secret; generating one-time migration password"
              BOLT_PASS=$(openssl rand -base64 32 | tr -d '/+=\n')
            fi
          else
            BOLT_PASS=$(openssl rand -base64 32 | tr -d '/+=\n')
          fi
          if [[ -z "${BOLT_PASS}" ]]; then
            echo "::error::Failed to generate or retrieve BOLT_PASSWORD"
            exit 1
          fi
          echo "::add-mask::${BOLT_PASS}"

          # Build secrets and env-var args for bolt
          declare -a SECRETS_ARGS
          declare -a ENV_VAR_ARGS
          if [[ -n "${CLUSTER_NODES}" ]]; then
            SECRETS_ARGS=("redis-cluster-nodes=${CLUSTER_NODES}")
            ENV_VAR_ARGS=(
              "ENVIRONMENT=production"
              "GQL_REDIS_CLUSTER_NODES=secretref:redis-cluster-nodes"
            )
          else
            SECRETS_ARGS=("redis-url=${REDIS_URL}")
            ENV_VAR_ARGS=(
              "ENVIRONMENT=production"
              "GQL_REDIS_URL=secretref:redis-url"
            )
          fi
          SECRETS_ARGS+=(
            "bolt-password=${BOLT_PASS}"
          )
          ENV_VAR_ARGS+=(
            "BOLT_BIND_ADDR=0.0.0.0:7687"
            "BOLT_PASSWORD=secretref:bolt-password"
          )
          if [[ "${BOLT_TLS_ENABLED}" == "true" ]]; then
            SECRETS_ARGS+=(
              "bolt-tls-cert=${DEPLOY_BOLT_TLS_CERT_PEM}"
              "bolt-tls-key=${DEPLOY_BOLT_TLS_KEY_PEM}"
            )
            ENV_VAR_ARGS+=(
              "BOLT_TLS_CERT=${BOLT_TLS_CERT_PATH}"
              "BOLT_TLS_KEY=${BOLT_TLS_KEY_PATH}"
              "BOLT_REQUIRE_TLS=1"
            )
          fi
          if [[ -n "${REPLICA_URL}" ]]; then
            SECRETS_ARGS+=("redis-replica-url=${REPLICA_URL}")
            ENV_VAR_ARGS+=("GQL_REDIS_REPLICA_URL=secretref:redis-replica-url")
          fi

          # Max replicas for horizontal scaling (default 1, configurable)
          BOLT_MAX_REPLICAS="${BOLT_MAX_REPLICAS:-1}"

          # Optional --secret-volume-mount (only needed when TLS certs are stored
          # as Container Apps secrets and read as files by the Bolt process).
          VOLUME_MOUNT_ARGS=()
          if [[ "${BOLT_TLS_ENABLED}" == "true" ]]; then
            VOLUME_MOUNT_ARGS=(--secret-volume-mount "${BOLT_SECRET_MOUNT_PATH}")
          fi

          # Helper: create bolt container app
          create_bolt_app() {
            ACR_ACCESS_TOKEN=$(az acr login --name "${ACR_NAME}" --expose-token --query accessToken -o tsv)
            if [[ -z "${ACR_ACCESS_TOKEN}" ]]; then
              echo "::error::Failed to obtain ACR access token for ${ACR_NAME}"
              exit 1
            fi
            echo "::add-mask::${ACR_ACCESS_TOKEN}"
            az containerapp create \
              --name "${CA_NAME}" \
              --resource-group "${RG}" \
              --environment "${CAE_NAME}" \
              --image "${IMAGE}" \
              --registry-server "${ACR_SERVER}" \
              --registry-username "00000000-0000-0000-0000-000000000000" \
              --registry-password "${ACR_ACCESS_TOKEN}" \
              --system-assigned \
              --cpu 0.5 \
              --memory 1Gi \
              --min-replicas 1 \
              --max-replicas "${BOLT_MAX_REPLICAS}" \
              --ingress external \
              --target-port 7687 \
              --transport tcp \
              --secrets "${SECRETS_ARGS[@]}" \
              --env-vars "${ENV_VAR_ARGS[@]}" \
              "${VOLUME_MOUNT_ARGS[@]}" \
              --output none
          }

          ensure_bolt_registry_identity_auth() {
            CA_PRINCIPAL_ID=$(az containerapp show \
              --name "${CA_NAME}" --resource-group "${RG}" \
              --query "identity.principalId" -o tsv 2>/dev/null || echo "")
            if [[ -z "${CA_PRINCIPAL_ID}" || "${CA_PRINCIPAL_ID}" == "None" ]]; then
              echo "::error::Bolt Container App managed identity is not available for ${CA_NAME}"
              exit 1
            fi
            ACR_RESOURCE_ID=$(az acr show --name "${ACR_NAME}" --query id -o tsv)
            ROLE_ASSIGNMENT_OUTPUT=""
            if ! ROLE_ASSIGNMENT_OUTPUT=$(az role assignment create \
              --assignee-object-id "${CA_PRINCIPAL_ID}" \
              --assignee-principal-type ServicePrincipal \
              --role "AcrPull" \
              --scope "${ACR_RESOURCE_ID}" \
              --output none 2>&1); then
              if [[ "${ROLE_ASSIGNMENT_OUTPUT}" != *"RoleAssignmentExists"* && \
                    "${ROLE_ASSIGNMENT_OUTPUT}" != *"role assignment already exists"* && \
                    "${ROLE_ASSIGNMENT_OUTPUT}" != *"The role assignment already exists"* ]]; then
                echo "::error::Failed to assign AcrPull role to ${CA_PRINCIPAL_ID}: ${ROLE_ASSIGNMENT_OUTPUT}"
                exit 1
              fi
              echo "   AcrPull role assignment already exists for ${CA_PRINCIPAL_ID}"
            fi
            ACR_PULL_VISIBLE=false
            for attempt in $(seq 1 12); do
              ASSIGNMENT_ERROR_FILE="$(mktemp)"
              if ! ASSIGNMENT_COUNT=$(az role assignment list \
                --assignee-object-id "${CA_PRINCIPAL_ID}" \
                --scope "${ACR_RESOURCE_ID}" \
                --query "[?roleDefinitionName=='AcrPull'] | length(@)" \
                -o tsv 2>"${ASSIGNMENT_ERROR_FILE}"); then
                ASSIGNMENT_ERROR="$(cat "${ASSIGNMENT_ERROR_FILE}")"
                rm -f "${ASSIGNMENT_ERROR_FILE}"
                echo "::error::Failed to verify AcrPull role assignment for ${CA_PRINCIPAL_ID}: ${ASSIGNMENT_ERROR}"
                exit 1
              fi
              rm -f "${ASSIGNMENT_ERROR_FILE}"
              if [[ "${ASSIGNMENT_COUNT}" =~ ^[1-9][0-9]*$ ]]; then
                ACR_PULL_VISIBLE=true
                break
              fi
              echo "   Waiting for AcrPull role assignment to propagate (attempt ${attempt}/12)..."
              sleep 10
            done
            if [[ "${ACR_PULL_VISIBLE}" != "true" ]]; then
              echo "::error::AcrPull role assignment for ${CA_PRINCIPAL_ID} was not visible before switching registry auth"
              exit 1
            fi
            az containerapp registry set \
              --name "${CA_NAME}" \
              --resource-group "${RG}" \
              --server "${ACR_SERVER}" \
              --identity system \
              --output none
          }

          # Idempotent create-or-update
          if [[ "${APP_EXISTS}" == "true" ]]; then
            echo "🔄 Updating existing bolt container app..."
            UPDATE_OK=true
            ensure_bolt_registry_identity_auth
            if ! az containerapp secret set \
              --name "${CA_NAME}" \
              --resource-group "${RG}" \
              --secrets "${SECRETS_ARGS[@]}" \
              --output none; then
              echo "::error::Failed to update Bolt Container App secrets"
              exit 1
            fi
            az containerapp update \
              --name "${CA_NAME}" \
              --resource-group "${RG}" \
              --image "${IMAGE}" \
              --set-env-vars "${ENV_VAR_ARGS[@]}" \
              --max-replicas "${BOLT_MAX_REPLICAS}" \
              "${VOLUME_MOUNT_ARGS[@]}" \
              --output none 2>&1 || UPDATE_OK=false

            if [[ "${UPDATE_OK}" == "false" ]]; then
              echo "⚠️  Update failed — deleting and recreating..."
              az containerapp delete --name "${CA_NAME}" --resource-group "${RG}" --yes --output none 2>/dev/null || true
              create_bolt_app
              ensure_bolt_registry_identity_auth
            fi
          else
            create_bolt_app
            ensure_bolt_registry_identity_auth
          fi

          echo "bolt_ca_name=${CA_NAME}" >> "$GITHUB_OUTPUT"
          echo "✅ Bolt Container App deployed: ${CA_NAME}"

      - name: Deploy sd2-api REST API Container App
        id: deploy-api
        env:
          DEPLOY_RG: ${{ needs.determine-environment.outputs.resource-group }}
          DEPLOY_ENV_NAME: ${{ needs.determine-environment.outputs.env-name }}
          DEPLOY_CAE_NAME: ${{ steps.provision.outputs.cae_name }}
          DEPLOY_ACR_SERVER: ${{ steps.provision.outputs.acr_server }}
          DEPLOY_ACR_NAME: ${{ steps.provision.outputs.acr_name }}
          DEPLOY_API_IMAGE_TAG: ${{ steps.build-api.outputs.api_image_tag }}
          DEPLOY_ENTRA_TENANT_ID: ${{ steps.provision-entra-api.outputs.entra_tenant_id }}
          DEPLOY_ENTRA_CLIENT_ID: ${{ steps.provision-entra-api.outputs.entra_client_id }}
        run: |
          RG="${DEPLOY_RG}"
          ENV_NAME="${DEPLOY_ENV_NAME}"
          CAE_NAME="${DEPLOY_CAE_NAME}"
          ACR_SERVER="${DEPLOY_ACR_SERVER}"
          ACR_NAME="${DEPLOY_ACR_NAME}"
          IMAGE="${ACR_SERVER}/sd2-api:${DEPLOY_API_IMAGE_TAG}"
          CA_NAME="sd2-${ENV_NAME}-api"

          echo "🚀 Deploying sd2-api REST API: ${CA_NAME}"

          # Build env vars — auth is always enabled in deployed environments
          ENV_VAR_ARGS="ENVIRONMENT=production"
          ENV_VAR_ARGS="${ENV_VAR_ARGS} GQL_API_ENTRA_TENANT_ID=${DEPLOY_ENTRA_TENANT_ID}"
          ENV_VAR_ARGS="${ENV_VAR_ARGS} GQL_API_ENTRA_CLIENT_ID=${DEPLOY_ENTRA_CLIENT_ID}"
          ENV_VAR_ARGS="${ENV_VAR_ARGS} GQL_API_BIND_ADDR=0.0.0.0:3001"
          ENV_VAR_ARGS="${ENV_VAR_ARGS} GQL_API_ALLOWED_ORIGINS=*"

          create_api_app() {
            echo "🆕 Creating sd2-api container app..."
            ACR_ACCESS_TOKEN=$(az acr login --name "${ACR_NAME}" --expose-token --query accessToken -o tsv)
            if [[ -z "${ACR_ACCESS_TOKEN}" ]]; then
              echo "::error::Failed to obtain ACR access token for ${ACR_NAME}"
              exit 1
            fi
            echo "::add-mask::${ACR_ACCESS_TOKEN}"
            az containerapp create \
              --name "${CA_NAME}" \
              --resource-group "${RG}" \
              --environment "${CAE_NAME}" \
              --image "${IMAGE}" \
              --registry-server "${ACR_SERVER}" \
              --registry-username "00000000-0000-0000-0000-000000000000" \
              --registry-password "${ACR_ACCESS_TOKEN}" \
              --system-assigned \
              --cpu 0.25 \
              --memory 0.5Gi \
              --min-replicas 1 \
              --max-replicas 3 \
              --ingress external \
              --target-port 3001 \
              --transport http \
              --env-vars ${ENV_VAR_ARGS} \
              --output none
          }

          ensure_api_registry_identity_auth() {
            CA_PRINCIPAL_ID=$(az containerapp show \
              --name "${CA_NAME}" --resource-group "${RG}" \
              --query "identity.principalId" -o tsv 2>/dev/null || echo "")
            if [[ -z "${CA_PRINCIPAL_ID}" || "${CA_PRINCIPAL_ID}" == "None" ]]; then
              echo "::error::API Container App managed identity is not available for ${CA_NAME}"
              exit 1
            fi
            ACR_RESOURCE_ID=$(az acr show --name "${ACR_NAME}" --query id -o tsv)
            ROLE_ASSIGNMENT_OUTPUT=""
            if ! ROLE_ASSIGNMENT_OUTPUT=$(az role assignment create \
              --assignee-object-id "${CA_PRINCIPAL_ID}" \
              --assignee-principal-type ServicePrincipal \
              --role "AcrPull" \
              --scope "${ACR_RESOURCE_ID}" \
              --output none 2>&1); then
              if [[ "${ROLE_ASSIGNMENT_OUTPUT}" != *"RoleAssignmentExists"* && \
                    "${ROLE_ASSIGNMENT_OUTPUT}" != *"role assignment already exists"* && \
                    "${ROLE_ASSIGNMENT_OUTPUT}" != *"The role assignment already exists"* ]]; then
                echo "::error::Failed to assign AcrPull role to ${CA_PRINCIPAL_ID}: ${ROLE_ASSIGNMENT_OUTPUT}"
                exit 1
              fi
              echo "   AcrPull role assignment already exists for ${CA_PRINCIPAL_ID}"
            fi
            ACR_PULL_VISIBLE=false
            for attempt in $(seq 1 12); do
              ASSIGNMENT_ERROR_FILE="$(mktemp)"
              if ! ASSIGNMENT_COUNT=$(az role assignment list \
                --assignee-object-id "${CA_PRINCIPAL_ID}" \
                --scope "${ACR_RESOURCE_ID}" \
                --query "[?roleDefinitionName=='AcrPull'] | length(@)" \
                -o tsv 2>"${ASSIGNMENT_ERROR_FILE}"); then
                ASSIGNMENT_ERROR="$(cat "${ASSIGNMENT_ERROR_FILE}")"
                rm -f "${ASSIGNMENT_ERROR_FILE}"
                echo "::error::Failed to verify AcrPull role assignment for ${CA_PRINCIPAL_ID}: ${ASSIGNMENT_ERROR}"
                exit 1
              fi
              rm -f "${ASSIGNMENT_ERROR_FILE}"
              if [[ "${ASSIGNMENT_COUNT}" =~ ^[1-9][0-9]*$ ]]; then
                ACR_PULL_VISIBLE=true
                break
              fi
              echo "   Waiting for AcrPull role assignment to propagate (attempt ${attempt}/12)..."
              sleep 10
            done
            if [[ "${ACR_PULL_VISIBLE}" != "true" ]]; then
              echo "::error::AcrPull role assignment for ${CA_PRINCIPAL_ID} was not visible before switching registry auth"
              exit 1
            fi
            az containerapp registry set \
              --name "${CA_NAME}" \
              --resource-group "${RG}" \
              --server "${ACR_SERVER}" \
              --identity system \
              --output none
          }

          # Idempotent create-or-update
          if az containerapp show --name "${CA_NAME}" --resource-group "${RG}" >/dev/null 2>&1; then
            echo "🔄 Updating existing sd2-api container app..."
            ensure_api_registry_identity_auth
            UPDATE_OK=true
            az containerapp update \
              --name "${CA_NAME}" \
              --resource-group "${RG}" \
              --image "${IMAGE}" \
              --set-env-vars ${ENV_VAR_ARGS} \
              --output none || UPDATE_OK=false
            if [[ "${UPDATE_OK}" == "false" ]]; then
              echo "⚠️  Update failed — deleting and recreating sd2-api..."
              az containerapp delete --name "${CA_NAME}" --resource-group "${RG}" --yes --output none 2>/dev/null || true
              create_api_app
              ensure_api_registry_identity_auth
            fi
          else
            create_api_app
            ensure_api_registry_identity_auth
          fi

          API_FQDN=$(az containerapp show \
            --name "${CA_NAME}" --resource-group "${RG}" \
            --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || echo "")
          echo "api_ca_name=${CA_NAME}" >> "$GITHUB_OUTPUT"
          echo "api_fqdn=${API_FQDN}" >> "$GITHUB_OUTPUT"
          echo "✅ sd2-api Container App deployed: ${CA_NAME} (https://${API_FQDN})"

      - name: Deploy sedandelivery-fabric-sync sidecar Container App
        id: deploy-sync
        if: env.ENABLE_FABRIC == 'true' && steps.fabric.outputs.has_fabric == 'true'
        env:
          DEPLOY_RG: ${{ needs.determine-environment.outputs.resource-group }}
          DEPLOY_ENV_NAME: ${{ needs.determine-environment.outputs.env-name }}
          DEPLOY_CAE_NAME: ${{ steps.provision.outputs.cae_name }}
          DEPLOY_ACR_SERVER: ${{ steps.provision.outputs.acr_server }}
          DEPLOY_ACR_NAME: ${{ steps.provision.outputs.acr_name }}
          DEPLOY_SYNC_IMAGE_TAG: ${{ steps.build-sync.outputs.sync_image_tag }}
          DEPLOY_FABRIC_ENDPOINT: ${{ steps.fabric.outputs.fabric_endpoint }}
          DEPLOY_AZURE_TENANT_ID: ${{ env.AZURE_TENANT_ID }}
          DEPLOY_AZURE_CLIENT_ID: ${{ env.AZURE_CLIENT_ID }}
          DEPLOY_AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          # Mask secrets FIRST before any other output.
          echo "::add-mask::${DEPLOY_AZURE_CLIENT_SECRET}"

          RG="${DEPLOY_RG}"
          ENV_NAME="${DEPLOY_ENV_NAME}"
          CAE_NAME="${DEPLOY_CAE_NAME}"
          ACR_SERVER="${DEPLOY_ACR_SERVER}"
          ACR_NAME="${DEPLOY_ACR_NAME}"
          IMAGE="${ACR_SERVER}/sedandelivery-fabric-sync:${DEPLOY_SYNC_IMAGE_TAG}"
          CA_NAME="sd2-${ENV_NAME}-sync"

          # Derive Redis FQDN from the already-deployed primary container app
          # (not from a step that runs later — that would always be empty).
          REDIS_CA_NAME="sd2-${ENV_NAME}-redis"
          REDIS_FQDN=$(az containerapp show \
            --name "${REDIS_CA_NAME}" \
            --resource-group "${RG}" \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv 2>/dev/null || echo "")
          if [[ -z "${REDIS_FQDN}" ]]; then
            echo "::error::Could not resolve Redis FQDN from ${REDIS_CA_NAME}"
            exit 1
          fi
          # Use short hostname (app name) for internal Container Apps communication
          # Include Valkey password from the main container's secrets
          VALKEY_PASS=$(az containerapp secret show             --name "${REDIS_CA_NAME}" --resource-group "${RG}"             --secret-name valkey-password --query value -o tsv 2>/dev/null || echo "")
          if [[ -n "${VALKEY_PASS}" ]]; then
            echo "::add-mask::${VALKEY_PASS}"
            REDIS_URL="redis://:${VALKEY_PASS}@${REDIS_CA_NAME}:6379"
          else
            REDIS_URL="redis://${REDIS_CA_NAME}:6379"
          fi

          echo "🔄 Deploying sedandelivery-fabric-sync: ${CA_NAME}"
          echo "   Image: ${IMAGE}"
          echo "   Redis: [masked]"

          create_sync_app() {
            echo "🆕 Creating sync container app..."
            ACR_ACCESS_TOKEN=$(az acr login --name "${ACR_NAME}" --expose-token --query accessToken -o tsv)
            if [[ -z "${ACR_ACCESS_TOKEN}" ]]; then
              echo "::error::Failed to obtain ACR access token for ${ACR_NAME}"
              exit 1
            fi
            echo "::add-mask::${ACR_ACCESS_TOKEN}"
            az containerapp create \
              --name "${CA_NAME}" \
              --resource-group "${RG}" \
              --environment "${CAE_NAME}" \
              --image "${IMAGE}" \
              --registry-server "${ACR_SERVER}" \
              --registry-username "00000000-0000-0000-0000-000000000000" \
              --registry-password "${ACR_ACCESS_TOKEN}" \
              --system-assigned \
              --cpu 0.25 \
              --memory 0.5Gi \
              --min-replicas 1 \
              --max-replicas 1 \
              --secrets "fabric-client-secret=${DEPLOY_AZURE_CLIENT_SECRET}" \
              --env-vars \
                "GQL_REDIS_URL=${REDIS_URL}" \
                "GQL_FABRIC_ENDPOINT=${DEPLOY_FABRIC_ENDPOINT}" \
                "GQL_FABRIC_TENANT_ID=${DEPLOY_AZURE_TENANT_ID}" \
                "GQL_FABRIC_CLIENT_ID=${DEPLOY_AZURE_CLIENT_ID}" \
                "GQL_FABRIC_CLIENT_SECRET=secretref:fabric-client-secret" \
              --output none
          }

          ensure_sync_registry_identity_auth() {
            SYNC_PRINCIPAL_ID=$(az containerapp show \
              --name "${CA_NAME}" --resource-group "${RG}" \
              --query "identity.principalId" -o tsv 2>/dev/null || echo "")
            if [[ -z "${SYNC_PRINCIPAL_ID}" || "${SYNC_PRINCIPAL_ID}" == "None" ]]; then
              echo "::error::Fabric sync Container App managed identity is not available for ${CA_NAME}"
              exit 1
            fi
            ACR_RESOURCE_ID=$(az acr show --name "${ACR_NAME}" --query id -o tsv)
            ROLE_ASSIGNMENT_OUTPUT=""
            if ! ROLE_ASSIGNMENT_OUTPUT=$(az role assignment create \
              --assignee-object-id "${SYNC_PRINCIPAL_ID}" \
              --assignee-principal-type ServicePrincipal \
              --role "AcrPull" \
              --scope "${ACR_RESOURCE_ID}" \
              --output none 2>&1); then
              if [[ "${ROLE_ASSIGNMENT_OUTPUT}" != *"RoleAssignmentExists"* && \
                    "${ROLE_ASSIGNMENT_OUTPUT}" != *"role assignment already exists"* && \
                    "${ROLE_ASSIGNMENT_OUTPUT}" != *"The role assignment already exists"* ]]; then
                echo "::error::Failed to assign AcrPull role to ${SYNC_PRINCIPAL_ID}: ${ROLE_ASSIGNMENT_OUTPUT}"
                exit 1
              fi
              echo "   AcrPull role assignment already exists for ${SYNC_PRINCIPAL_ID}"
            fi
            ACR_PULL_VISIBLE=false
            for attempt in $(seq 1 12); do
              ASSIGNMENT_ERROR_FILE="$(mktemp)"
              if ! ASSIGNMENT_COUNT=$(az role assignment list \
                --assignee-object-id "${SYNC_PRINCIPAL_ID}" \
                --scope "${ACR_RESOURCE_ID}" \
                --query "[?roleDefinitionName=='AcrPull'] | length(@)" \
                -o tsv 2>"${ASSIGNMENT_ERROR_FILE}"); then
                ASSIGNMENT_ERROR="$(cat "${ASSIGNMENT_ERROR_FILE}")"
                rm -f "${ASSIGNMENT_ERROR_FILE}"
                echo "::error::Failed to verify AcrPull role assignment for ${SYNC_PRINCIPAL_ID}: ${ASSIGNMENT_ERROR}"
                exit 1
              fi
              rm -f "${ASSIGNMENT_ERROR_FILE}"
              if [[ "${ASSIGNMENT_COUNT}" =~ ^[1-9][0-9]*$ ]]; then
                ACR_PULL_VISIBLE=true
                break
              fi
              echo "   Waiting for AcrPull role assignment to propagate (attempt ${attempt}/12)..."
              sleep 10
            done
            if [[ "${ACR_PULL_VISIBLE}" != "true" ]]; then
              echo "::error::AcrPull role assignment for ${SYNC_PRINCIPAL_ID} was not visible before switching registry auth"
              exit 1
            fi
            az containerapp registry set \
              --name "${CA_NAME}" \
              --resource-group "${RG}" \
              --server "${ACR_SERVER}" \
              --identity system \
              --output none
          }

          if az containerapp show --name "${CA_NAME}" --resource-group "${RG}" >/dev/null 2>&1; then
            echo "🔄 Updating existing sync container app..."
            ensure_sync_registry_identity_auth
            az containerapp secret set \
              --name "${CA_NAME}" --resource-group "${RG}" \
              --secrets "fabric-client-secret=${DEPLOY_AZURE_CLIENT_SECRET}" \
              --output none
            UPDATE_OK=true
            az containerapp update \
              --name "${CA_NAME}" --resource-group "${RG}" \
              --image "${IMAGE}" \
              --set-env-vars \
                "GQL_REDIS_URL=${REDIS_URL}" \
                "GQL_FABRIC_ENDPOINT=${DEPLOY_FABRIC_ENDPOINT}" \
                "GQL_FABRIC_TENANT_ID=${DEPLOY_AZURE_TENANT_ID}" \
                "GQL_FABRIC_CLIENT_ID=${DEPLOY_AZURE_CLIENT_ID}" \
                "GQL_FABRIC_CLIENT_SECRET=secretref:fabric-client-secret" \
              --output none || UPDATE_OK=false
            if [[ "${UPDATE_OK}" == "false" ]]; then
              echo "⚠️  Update failed — deleting and recreating sync container app..."
              az containerapp delete --name "${CA_NAME}" --resource-group "${RG}" --yes --output none 2>/dev/null || true
              create_sync_app
              ensure_sync_registry_identity_auth
            fi
          else
            create_sync_app
            ensure_sync_registry_identity_auth
          fi

          echo "✅ sedandelivery-fabric-sync deployed: ${CA_NAME}"

      - name: Get deployment outputs
        id: outputs
        run: |
          RG="${{ needs.determine-environment.outputs.resource-group }}"
          REDIS_CA_NAME="${{ steps.deploy-app.outputs.ca_name }}"
          BOLT_CA_NAME="${{ steps.deploy-bolt.outputs.bolt_ca_name }}"

          REDIS_FQDN=$(az containerapp show \
            --name "${REDIS_CA_NAME}" \
            --resource-group "${RG}" \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv 2>/dev/null || echo "")
          BOLT_FQDN=$(az containerapp show \
            --name "${BOLT_CA_NAME}" \
            --resource-group "${RG}" \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv 2>/dev/null || echo "")

          echo "redis_fqdn=${REDIS_FQDN}" >> "$GITHUB_OUTPUT"
          echo "bolt_fqdn=${BOLT_FQDN}" >> "$GITHUB_OUTPUT"
          echo "✅ SedanDelivery external endpoints:"
          echo "   Redis: ${REDIS_FQDN}:6379"
          echo "   Bolt:  ${BOLT_FQDN}:7687"

      - name: Redis health check
        env:
          DEPLOY_RG: ${{ needs.determine-environment.outputs.resource-group }}
          DEPLOY_ENV_NAME: ${{ needs.determine-environment.outputs.env-name }}
          DEPLOY_AZURE_CACHE_NAME: ${{ steps.provision.outputs.azure_cache_name }}
          DEPLOY_PERSISTENCE_BACKEND: ${{ needs.determine-environment.outputs.persistence-backend }}
        run: |
          RG="${DEPLOY_RG}"
          ENV_NAME="${DEPLOY_ENV_NAME}"
          PERSISTENCE_BACKEND="${DEPLOY_PERSISTENCE_BACKEND}"

          echo "🏥 Running Redis health check (backend: ${PERSISTENCE_BACKEND})..."

          if [[ "${PERSISTENCE_BACKEND}" == "azure-cache" || "${PERSISTENCE_BACKEND}" == "cluster" ]]; then
            # Azure Cache health check via az redis CLI
            CACHE_NAME="${DEPLOY_AZURE_CACHE_NAME}"
            if [[ -z "${CACHE_NAME}" ]]; then
              echo "::error::Azure Cache name not available for health check"
              exit 1
            fi

            PROVISIONING_STATE=$(az redis show \
              --name "${CACHE_NAME}" --resource-group "${RG}" \
              --query "provisioningState" -o tsv 2>/dev/null || echo "Unknown")
            echo "   Provisioning state: ${PROVISIONING_STATE}"
            if [[ "${PROVISIONING_STATE}" != "Succeeded" ]]; then
              echo "::warning::Azure Cache provisioning state is '${PROVISIONING_STATE}', not 'Succeeded'"
            fi

            # Verify connectivity by listing keys (confirms network path works)
            REDIS_KEY=$(az redis list-keys --name "${CACHE_NAME}" --resource-group "${RG}" --query primaryKey -o tsv 2>/dev/null || echo "")
            echo "::add-mask::${REDIS_KEY}"
            if [[ -z "${REDIS_KEY}" ]]; then
              echo "::error::Cannot retrieve Redis keys — health check failed"
              exit 1
            fi
            echo "   Key retrieval: OK"

            if [[ "${PERSISTENCE_BACKEND}" == "cluster" ]]; then
              # Verify cluster is enabled on the Azure Cache instance
              CLUSTER_ENABLED=$(az redis show \
                --name "${CACHE_NAME}" --resource-group "${RG}" \
                --query "properties.redisConfiguration.cluster-enabled" -o tsv 2>/dev/null || echo "")
              echo "   Cluster enabled: ${CLUSTER_ENABLED:-unknown}"
            fi
          else
            # Valkey container health check — verify the container app is running
            REDIS_CA_NAME="sd2-${ENV_NAME}-redis"
            RUNNING=$(timeout 10s az containerapp show \
              --name "${REDIS_CA_NAME}" --resource-group "${RG}" \
              --query "properties.runningStatus" -o tsv 2>/dev/null || echo "Unknown")
            echo "   Valkey container state: ${RUNNING}"
            if [[ "${RUNNING}" != "Running" ]]; then
              echo "::warning::Valkey container is not in Running state (${RUNNING})"
            fi
          fi
          echo "✅ Redis health check complete"

      - name: Smoke test via Bolt endpoint
        env:
          DEPLOY_RG: ${{ needs.determine-environment.outputs.resource-group }}
          DEPLOY_ENV_NAME: ${{ needs.determine-environment.outputs.env-name }}
        run: |
          RG="${DEPLOY_RG}"
          ENV_NAME="${DEPLOY_ENV_NAME}"
          BOLT_CA_NAME="sd2-${ENV_NAME}-bolt"

          BOLT_FQDN=$(az containerapp show \
            --name "${BOLT_CA_NAME}" --resource-group "${RG}" \
            --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || echo "")

          if [[ -z "${BOLT_FQDN}" ]]; then
            echo "::error::Cannot resolve Bolt FQDN"
            exit 1
          fi

          echo "🧪 Running smoke test against Bolt endpoint: ${BOLT_FQDN}:7687"

          # The default ACA hostname intentionally requires a trust override, so the
          # smoke test validates that the endpoint presents the configured certificate
          # and that the certificate is currently within its validity window.
          SMOKE_OK=false
          SMOKE_LOG="${RUNNER_TEMP}/bolt-smoke.log"
          EXPECTED_CERT_FILE="${RUNNER_TEMP}/expected-bolt-cert.pem"
          LIVE_CERT_FILE="${RUNNER_TEMP}/live-bolt-cert.pem"
          EXPECTED_CERT_PEM=$(az containerapp secret show \
            --name "${BOLT_CA_NAME}" --resource-group "${RG}" \
            --secret-name bolt-tls-cert --query value -o tsv 2>/dev/null || echo "")
          if [[ -z "${EXPECTED_CERT_PEM}" ]]; then
            echo "::error::Failed to resolve configured bolt-tls-cert secret"
            exit 1
          fi
          printf '%s\n' "${EXPECTED_CERT_PEM}" > "${EXPECTED_CERT_FILE}"
          EXPECTED_CERT_SHA256=$(openssl x509 -in "${EXPECTED_CERT_FILE}" -noout -fingerprint -sha256 2>/dev/null | cut -d= -f2 | tr -d ':')
          if [[ -z "${EXPECTED_CERT_SHA256}" ]]; then
            echo "::error::Failed to parse configured bolt-tls-cert"
            exit 1
          fi
          for i in $(seq 1 6); do
            SMOKE_EXIT=0
            timeout 10 bash -c "printf '' | openssl s_client -showcerts -connect '${BOLT_FQDN}:7687' -servername '${BOLT_FQDN}' >'${SMOKE_LOG}' 2>&1" || SMOKE_EXIT=$?
            if [[ "${SMOKE_EXIT}" -ne 0 && "${SMOKE_EXIT}" -ne 124 ]]; then
              echo "   Attempt ${i}/6: openssl exited with status ${SMOKE_EXIT}, waiting..."
              sleep 10
              continue
            fi
            awk '/BEGIN CERTIFICATE/{flag=1} flag{print} /END CERTIFICATE/{exit}' "${SMOKE_LOG}" > "${LIVE_CERT_FILE}"
            if [[ ! -s "${LIVE_CERT_FILE}" ]]; then
              echo "   Attempt ${i}/6: no certificate presented yet, waiting..."
              sleep 10
              continue
            fi
            LIVE_CERT_SHA256=$(openssl x509 -in "${LIVE_CERT_FILE}" -noout -fingerprint -sha256 2>/dev/null | cut -d= -f2 | tr -d ':')
            if [[ -z "${LIVE_CERT_SHA256}" || "${LIVE_CERT_SHA256}" != "${EXPECTED_CERT_SHA256}" ]]; then
              echo "   Attempt ${i}/6: live certificate does not match configured bolt-tls-cert, waiting..."
              sleep 10
              continue
            fi
            if ! openssl x509 -in "${LIVE_CERT_FILE}" -checkend 0 -noout >/dev/null 2>&1; then
              echo "   Attempt ${i}/6: live certificate is expired, waiting..."
              sleep 10
              continue
            fi
            if grep -Eq 'no peer certificate available|Cipher is \(NONE\)|wrong version number|unexpected eof while reading' "${SMOKE_LOG}"; then
              echo "   Attempt ${i}/6: TLS handshake did not complete cleanly, waiting..."
              sleep 10
              continue
            fi
            echo "   TLS handshake reached Bolt endpoint with the configured, unexpired certificate (attempt ${i})"
            SMOKE_OK=true
            break
          done

          if [[ "${SMOKE_OK}" == "false" ]]; then
            echo "::error::Bolt TLS smoke test did not observe the configured, unexpired certificate after 60s"
            cat "${SMOKE_LOG}" || true
            exit 1
          fi

          echo "✅ Smoke test passed — Bolt endpoint presented the configured, unexpired TLS certificate"

      - name: Smoke test Bolt driver query
        env:
          DEPLOY_RG: ${{ needs.determine-environment.outputs.resource-group }}
          DEPLOY_ENV_NAME: ${{ needs.determine-environment.outputs.env-name }}
        run: |
          RG="${DEPLOY_RG}"
          ENV_NAME="${DEPLOY_ENV_NAME}"
          BOLT_CA_NAME="sd2-${ENV_NAME}-bolt"

          BOLT_FQDN=$(az containerapp show \
            --name "${BOLT_CA_NAME}" --resource-group "${RG}" \
            --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || echo "")

          if [[ -z "${BOLT_FQDN}" ]]; then
            echo "::error::Cannot resolve Bolt FQDN"
            exit 1
          fi

          BOLT_PASSWORD=$(az containerapp secret show \
            --name "${BOLT_CA_NAME}" --resource-group "${RG}" \
            --secret-name bolt-password --query value -o tsv 2>/dev/null || echo "")
          if [[ -z "${BOLT_PASSWORD}" ]]; then
            echo "::error::Failed to resolve deployed bolt-password secret"
            exit 1
          fi
          echo "::add-mask::${BOLT_PASSWORD}"

          if ! python3 -c "import neo4j" >/dev/null 2>&1; then
            python3 -m pip install --quiet neo4j
          fi

          export BOLT_URI="bolt+ssc://${BOLT_FQDN}:7687"
          export BOLT_PASSWORD
          DRIVER_OK=false
          DRIVER_LOG="${RUNNER_TEMP}/bolt-driver-smoke.log"

          for i in $(seq 1 6); do
            DRIVER_EXIT=0
            python3 - <<'PY' >"${DRIVER_LOG}" 2>&1 || DRIVER_EXIT=$?
import os

from neo4j import GraphDatabase

uri = os.environ["BOLT_URI"]
password = os.environ["BOLT_PASSWORD"]

driver = GraphDatabase.driver(uri, auth=("neo4j", password))
try:
    driver.verify_connectivity()
    with driver.session() as session:
        record = session.run("RETURN 1 AS ok").single(strict=True)
        if record["ok"] != 1:
            raise SystemExit(f"expected ok=1, got {record['ok']!r}")
finally:
    driver.close()
PY
            if [[ "${DRIVER_EXIT}" -eq 0 ]]; then
              echo "   Bolt driver handshake and RETURN 1 succeeded (attempt ${i})"
              DRIVER_OK=true
              break
            fi
            echo "   Attempt ${i}/6: Bolt driver smoke failed (exit ${DRIVER_EXIT}), waiting..."
            cat "${DRIVER_LOG}" || true
            sleep 10
          done

          if [[ "${DRIVER_OK}" == "false" ]]; then
            echo "::error::Bolt driver smoke test did not complete a successful handshake/query after 60s"
            cat "${DRIVER_LOG}" || true
            exit 1
          fi

          echo "✅ Bolt driver smoke test passed — authenticated handshake and RETURN 1 succeeded"

      - name: Post deployment comment to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@450193c5abd4cdb17ba9f3ffcfe8f635c4bb6c2a # v7.0.1
        with:
          script: |
            const redisFqdn = '${{ steps.outputs.outputs.redis_fqdn }}';
            const boltFqdn = '${{ steps.outputs.outputs.bolt_fqdn }}';
            const envName = '${{ needs.determine-environment.outputs.env-name }}';
            const imageTag = '${{ steps.build.outputs.image_tag }}'.substring(0, 7);
            const rg = '${{ needs.determine-environment.outputs.resource-group }}';
            const redisCaName = '${{ steps.deploy-app.outputs.ca_name }}';
            const boltCaName = '${{ steps.deploy-bolt.outputs.bolt_ca_name }}';

            const body = `## ✅ SedanDelivery Deployed

            | Field | Value |
            |-------|-------|
            | Environment | \`${envName}\` |
            | Resource Group | \`${rg}\` |
            | Redis Container App | \`${redisCaName}\` |
            | Bolt Container App | \`${boltCaName}\` |
            | Redis FQDN | \`${redisFqdn}\` |
            | Bolt FQDN | \`${boltFqdn}\` |
            | Redis | \`${redisFqdn}:6379\` (external TCP) |
            | Bolt | \`${boltFqdn}:7687\` (external TCP + TLS) |
            | Image Tag | \`${imageTag}\` |

            **Connect via Redis:**
            \`\`\`bash
            redis-cli -h ${redisFqdn} -p 6379 PING
            redis-cli -h ${redisFqdn} -p 6379 MODULE LIST
            \`\`\`

            **Retrieve the Bolt password:**
            \`\`\`bash
            az containerapp secret show \\
              --name ${boltCaName} \\
              --resource-group ${rg} \\
              --secret-name bolt-password \\
              --query value -o tsv
            \`\`\`

            **Temporary bootstrap connection via Bolt (trust override required):**
            \`\`\`python
            from neo4j import GraphDatabase
            driver = GraphDatabase.driver(
                "bolt+ssc://${boltFqdn}:7687",
                auth=("neo4j", "<retrieve-bolt-password>"),
            )
            \`\`\`

            This ACA-generated hostname does **not** provide production-authenticated
            TLS. Use \`bolt+ssc://\` only for temporary bootstrap or trusted-network
            validation where you explicitly accept the trust override. Before treating
            the endpoint as production-ready for untrusted clients, bind a custom
            domain with a matching CA-issued certificate and switch clients to
            \`bolt+s://\`.

            To clean up: run **Undeploy** workflow with resource group \`${rg}\`.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('SedanDelivery Deployed')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
