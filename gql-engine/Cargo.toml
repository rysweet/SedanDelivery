[package]
name    = "gql-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
readme  = "README.md"
description = "ISO/IEC 39075 (GQL) query processor built on cypher-core"

[features]
default    = []
test-utils = ["cypher-core/test-utils"]

[dependencies]
cypher-core = { path = "../cypher-core" }
thiserror   = { workspace = true }
smol_str    = { workspace = true }
tracing     = { workspace = true }

[dev-dependencies]
proptest  = { workspace = true }
criterion = { workspace = true }

[[bench]]
name    = "gql_parse"
harness = false
