# docker-compose.yml — Neodash dashboard builder for SedanDelivery
#
# Neodash connects via Bolt protocol to SedanDelivery's graph engine
# and provides an interactive dashboard UI for the MITRE ATT&CK dataset.
#
# Usage:
#   docker compose up -d
#   open http://localhost:5005
#
# Prerequisite: SedanDelivery Bolt server running on host port 7687

services:
  neodash:
    image: neo4jlabs/neodash:latest
    container_name: neodash-sedandelivery
    ports:
      - "5005:5005"
    environment:
      # Connection to SedanDelivery Bolt server on the host
      # Linux uses 172.17.0.1 (docker bridge); macOS/Windows use host.docker.internal
      ssoEnabled: "false"
      ssoDiscoveryUrl: ""
      # Neodash standalone mode configuration
      standaloneDashboardURL: ""
      standaloneDashboardDatabase: ""
      standaloneDashboardName: ""
      standaloneProtocol: "bolt"
      standaloneHost: "172.17.0.1"
      standalonePort: "7687"
      standaloneDatabase: ""
      standaloneUsername: "${BOLT_USERNAME:-neo4j}"
      standalonePassword: "${BOLT_PASSWORD:?Set BOLT_PASSWORD for neo4j-compat-gallery/app1-neodash/docker-compose.yml}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5005"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
