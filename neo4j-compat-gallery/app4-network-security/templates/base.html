<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Network Security Analyzer{% endblock %}</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: #1a2332;
            --bg-card-hover: #1f2b3d;
            --border: #2a3a4e;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-orange: #f97316;
            --accent-yellow: #eab308;
            --accent-purple: #8b5cf6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* ── Navigation ─────────────────────────────────── */
        nav {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            display: flex;
            align-items: center;
            height: 56px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-right: 2rem;
            text-decoration: none;
            color: var(--text-primary);
        }

        nav .logo .icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        nav .logo span {
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: -0.02em;
        }

        nav .links {
            display: flex;
            gap: 0.25rem;
        }

        nav .links a {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.15s;
        }

        nav .links a:hover,
        nav .links a.active {
            color: var(--text-primary);
            background: var(--bg-card);
        }

        nav .links a.active {
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent-blue);
        }

        nav .badge {
            margin-left: auto;
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        nav .badge .dot {
            width: 8px;
            height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ── Layout ─────────────────────────────────────── */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem 2rem;
        }

        .page-header {
            margin-bottom: 1.5rem;
        }

        .page-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .page-header p {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }

        /* ── Cards ──────────────────────────────────────── */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.25rem;
        }

        .card h2 {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }

        /* ── Grid ───────────────────────────────────────── */
        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        /* ── Stat cards ─────────────────────────────────── */
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.25rem;
        }

        .stat-card .label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 800;
            margin-top: 0.25rem;
            letter-spacing: -0.03em;
        }

        .stat-card .sub {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        /* ── Tables ─────────────────────────────────────── */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 0.75rem;
            font-size: 0.875rem;
            border-bottom: 1px solid rgba(42, 58, 78, 0.5);
        }

        tr:hover td {
            background: var(--bg-card-hover);
        }

        /* ── Badges ─────────────────────────────────────── */
        .severity {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .severity.critical { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); }
        .severity.high { background: rgba(249, 115, 22, 0.2); color: var(--accent-orange); }
        .severity.medium { background: rgba(234, 179, 8, 0.2); color: var(--accent-yellow); }
        .severity.low { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); }

        /* ── Graph container ────────────────────────────── */
        .graph-container {
            width: 100%;
            height: 500px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .graph-container.large {
            height: 700px;
        }

        /* ── Risk gauge ─────────────────────────────────── */
        .risk-gauge {
            text-align: center;
            padding: 1.5rem;
        }

        .risk-gauge .score {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: -0.04em;
        }

        .risk-gauge .grade {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 0.25rem;
        }

        .risk-gauge .bar {
            height: 8px;
            background: var(--bg-secondary);
            border-radius: 4px;
            margin-top: 1rem;
            overflow: hidden;
        }

        .risk-gauge .bar .fill {
            height: 100%;
            border-radius: 4px;
            transition: width 1s ease;
        }

        /* ── Select / Button ────────────────────────────── */
        select, button {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            cursor: pointer;
        }

        button {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            font-weight: 600;
        }

        button:hover {
            opacity: 0.9;
        }

        /* ── Path list ──────────────────────────────────── */
        .path-item {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.75rem;
        }

        .path-item .path-chain {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }

        .path-item .node {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 0.3rem 0.7rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-family: monospace;
        }

        .path-item .arrow {
            color: var(--accent-red);
            font-weight: bold;
        }

        /* ── Responsive ─────────────────────────────────── */
        @media (max-width: 1024px) {
            .grid-4 { grid-template-columns: repeat(2, 1fr); }
            .grid-3 { grid-template-columns: 1fr; }
            .grid-2 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="logo">
            <div class="icon">&#x1f6e1;</div>
            <span>NetSec Analyzer</span>
        </a>
        <div class="links">
            <a href="/" class="{% if active_page == 'dashboard' %}active{% endif %}">Dashboard</a>
            <a href="/topology" class="{% if active_page == 'topology' %}active{% endif %}">Topology</a>
            <a href="/attack-paths" class="{% if active_page == 'attack_paths' %}active{% endif %}">Attack Paths</a>
            <a href="/vulns" class="{% if active_page == 'vulns' %}active{% endif %}">Vulnerabilities</a>
        </div>
        <div class="badge">
            <div class="dot"></div>
            SedanDelivery Bolt
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
