# Neo4j Compatibility Gallery — Full Stack
#
# Runs SedanDelivery Bolt server + all 4 gallery apps.
# Usage: docker compose up -d
#
# Prereqs:
#   docker build -f Dockerfile.bolt -t sedandelivery-bolt ..

services:
  # ── SedanDelivery Bolt Protocol Server ──────────────────────────────────
  sedandelivery-bolt:
    image: sedandelivery-bolt:latest
    build:
      context: ..
      dockerfile: neo4j-compat-gallery/Dockerfile.bolt
    ports:
      - "7687:7687"   # Bolt protocol
      - "7688:7688"   # Health/metrics
    environment:
      - RUST_LOG=info
      - BOLT_PASSWORD=${BOLT_PASSWORD:?Set BOLT_PASSWORD for neo4j-compat-gallery/docker-compose.yml}
      - BOLT_IDLE_TIMEOUT_SECS=3600
      - BOLT_MAX_CONNECTIONS=1024
      - BOLT_WRITE_CONCURRENCY=128
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7688/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── App 1: Neodash Security Dashboard ──────────────────────────────────
  neodash:
    image: neo4jlabs/neodash:latest
    ports:
      - "5005:5005"
    environment:
      - ssoEnabled=false
      - ssoDiscoveryUrl=
      - standalone=true
      - standaloneProtocol=bolt
      - standaloneHost=sedandelivery-bolt
      - standalonePort=7687
      - standaloneDatabase=
      - standaloneDashboardName=MITRE ATT&CK Security Dashboard
      - standaloneDashboardDatabase=
      - standaloneUsername=${BOLT_USERNAME:-neo4j}
      - standalonePassword=${BOLT_PASSWORD:?Set BOLT_PASSWORD for neo4j-compat-gallery/docker-compose.yml}
      - standaloneAllowLoad=true
    depends_on:
      sedandelivery-bolt:
        condition: service_healthy

  # ── App 2: neovis.js Threat Visualization ──────────────────────────────
  neovis:
    image: python:3.11-slim
    ports:
      - "8080:8080"
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir neo4j && python server.py"
    volumes:
      - ./app2-neovis:/app:ro
    environment:
      - BOLT_URI=bolt://sedandelivery-bolt:7687
      - BOLT_USERNAME=${BOLT_USERNAME:-neo4j}
      - BOLT_PASSWORD=${BOLT_PASSWORD:?Set BOLT_PASSWORD for neo4j-compat-gallery/docker-compose.yml}
      - PORT=8080
    depends_on:
      sedandelivery-bolt:
        condition: service_healthy

  # ── App 3: GraphKer CVE Explorer ───────────────────────────────────────
  graphker:
    build:
      context: ./app3-graphker
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - BOLT_URI=bolt://sedandelivery-bolt:7687
      - BOLT_USERNAME=${BOLT_USERNAME:-neo4j}
      - BOLT_PASSWORD=${BOLT_PASSWORD:?Set BOLT_PASSWORD for neo4j-compat-gallery/docker-compose.yml}
      - FLASK_ENV=production
    depends_on:
      sedandelivery-bolt:
        condition: service_healthy

  # ── App 4: Network Security Analyzer ───────────────────────────────────
  network-security:
    build:
      context: ./app4-network-security
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    environment:
      - BOLT_URI=bolt://sedandelivery-bolt:7687
      - BOLT_USERNAME=${BOLT_USERNAME:-neo4j}
      - BOLT_PASSWORD=${BOLT_PASSWORD:?Set BOLT_PASSWORD for neo4j-compat-gallery/docker-compose.yml}
      - FLASK_ENV=production
    depends_on:
      sedandelivery-bolt:
        condition: service_healthy
